  const ref = useRef(null);

  const toggleSound = (e)=>{ e.stopPropagation(); const v=ref.current; if(!v) return;

/* ───────── D-day / 오늘의 할일 엔진 ───────── */
function ddayAnnual(mmdd){ // 'YYYY-MM-DD' → 올해 기준 남은 일수(생일·기념일 반복)
  if(!mmdd) return null; const t=new Date(); t.setHours(0,0,0,0);
  const p=mmdd.split('-'); let d=new Date(t.getFullYear(),+p[1]-1,+p[2]);
  if(d<t) d=new Date(t.getFullYear()+1,+p[1]-1,+p[2]);
  return Math.round((d-t)/864e5);
}
function ddayAbs(date){ // 절대일자까지 남은 일수(+미래 / -과거)
  if(!date) return null; const t=new Date(); t.setHours(0,0,0,0);
  const p=date.split('-'); const d=new Date(+p[0],+p[1]-1,+p[2]);
  return Math.round((d-t)/864e5);
}
function daysSince(date){ if(!date) return null; return -ddayAbs(date); }
const ddLabel=(n)=> n===0?'D-DAY':(n>0?'D-'+n:'D+'+(-n));

// 고객 리스트 → 할일 아이템(우선순위순)
function buildTodos(customers){
  const items=[];
  for(const c of customers){
    for(const ct of (c.contracts||[])){
      if(ct.status==='미납'||ct.unpaid>=1){
        const crit=ct.unpaid>=2;
        items.push({p:crit?0:1,type:'미납',icon:'⚠️',color:crit?'#E23B4E':'#C97A00',cust:c,
          text:`${ct.product} ${ct.unpaid}개월 미납${crit?' · 실효 위험!':''}`,dd:crit?0:1});
      }
      const m=ddayAbs(ct.maturity);
      if(m!==null && m>=0 && m<=30) items.push({p:2,type:'만기/갱신',icon:'🔁',color:'#1F5BFF',cust:c,text:`${ct.product} 만기·갱신`,dd:m});
    }
    const sg=daysSince(c.surgery), dc=ddayAbs(c.discharge);
    if(c.surgery && sg!==null && sg>=0 && sg<=14) items.push({p:1,type:'병원',icon:'🏥',color:'#7A5BFF',cust:c,text:`수술 후 케어 · 실손청구 안내`,dd:dc!==null?dc:0});
    else if(dc!==null && dc>=0 && dc<=7) items.push({p:1,type:'병원',icon:'🏥',color:'#7A5BFF',cust:c,text:`퇴원 예정 · 청구 서류 팔로업`,dd:dc});
    const bd=ddayAnnual(c.birthday); if(bd!==null && bd<=7) items.push({p:2,type:'생일',icon:'🎂',color:'#12A150',cust:c,text:`생일 축하 연락`,dd:bd});
    const an=ddayAnnual(c.anniversary); if(an!==null && an<=7) items.push({p:2,type:'결혼기념일',icon:'💍',color:'#12A150',cust:c,text:`결혼기념일 축하`,dd:an});
    const cb=ddayAbs(c.childbirth); if(c.childbirth && cb!==null && cb>=-14 && cb<=30) items.push({p:1,type:'출산',icon:'👶',color:'#E86AA6',cust:c,text:`출산 축하 · 어린이보험 제안`,dd:cb});
    const lc=daysSince(c.lastContact); if(lc!==null && lc>=45 && !c.surgery) items.push({p:3,type:'안부',icon:'📞',color:'#5B6781',cust:c,text:`${lc}일째 미접촉 · 안부 연락`,dd:0});
  }
  return items.sort((a,b)=> a.p-b.p || a.dd-b.dd);
}

  const [pf,br,tm,cu,sa,re,cl,dc,po,st]=await Promise.all([q('profiles'),q('branches'),q('teams'),q('customers'),q('sales'),q('recruits'),q('claims'),q('documents'),q('posts'),q('app_settings')]);
  return { mode:'real', session:sessionId,
    users:(pf.data||[]).map(fromProfile), branches:(br.data||[]).map(fromBranch), teams:(tm.data||[]).map(fromTeam),
    customers:(cu.data||[]).map(fromCustomer), sales:(sa.data||[]).map(fromSale), recruits:(re.data||[]).map(fromRecruit),
    claims:(cl.data||[]).map(fromClaim), docs:(dc.data||[]).map(fromDoc), posts:(po.data||[]).map(fromPost),
    settings:fromSettings((st.data||[])[0]) };
}
// 내 소유 행만 Supabase에 업서트(RLS가 내 것만 허용) — commit 때 자동
async function syncMine(db, me){
  if(!me) return;
  const up=async(t,rows)=>{ if(rows.length){ const {error}=await SB.from(t).upsert(rows); if(error) console.warn('sync '+t, error.message); } };
  await up('profiles', db.users.filter(u=>u.id===me.id).map(toProfile));
  await up('branches', db.branches.filter(b=>b.managerId===me.id).map(toBranch));
  await up('teams', db.teams.filter(t=>t.leaderId===me.id).map(toTeam));
  await up('customers', db.customers.filter(c=>c.ownerId===me.id).map(toCustomer));
  await up('sales', db.sales.filter(s=>s.agentId===me.id).map(toSale));
  await up('recruits', db.recruits.filter(r=>r.ownerId===me.id).map(toRecruit));
  await up('claims', db.claims.filter(c=>c.ownerId===me.id).map(toClaim));
  await up('documents', db.docs.filter(d=>d.ownerId===me.id).map(toDoc));
  await up('posts', db.posts.filter(p=>p.authorId===me.id).map(toPost));
  if(me.role==='hq' && db.settings) await SB.from('app_settings').upsert({id:1,doc_retention_months:db.settings.docRetentionMonths,commission_rate:db.settings.commissionRate});
}

/* ───────── 메인 앱 ───────── */
function App(){
  const [db,setDb] = useState(null);       // null = 부팅중
  const isJoin = (()=>{try{return /(^|[?#&])join/.test(location.search+location.hash)}catch(e){return false}})();
  const [route,setRoute] = useState(isJoin?'join':'landing');
  const [toast,setToast] = useState('');
  const flash = (m)=>{ setToast(m); setTimeout(()=>setToast(''),2200); };
  const me = db ? (db.users.find(u=>u.id===db.session) || null) : null;

  // 🚫 롱프레스/우클릭 시 뜨는 공유·저장(컨텍스트 메뉴) 차단 — 입력창은 예외
  useEffect(()=>{ const block=(e)=>{ const t=e.target; if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||(t&&t.isContentEditable)) return; e.preventDefault(); };
    document.addEventListener('contextmenu',block); document.addEventListener('dragstart',block);
    return ()=>{ document.removeEventListener('contextmenu',block); document.removeEventListener('dragstart',block); }; },[]);

  // 🌗 전역 테마(기본 라이트) — <html data-theme>로 전 페이지 적용
  const [theme,setTheme]=useState(()=>{try{return localStorage.getItem('insu_theme')||'light'}catch(e){return 'light'}});
  useEffect(()=>{ document.documentElement.setAttribute('data-theme',theme);
    const tc=document.querySelector('meta[name="theme-color"]'); if(tc) tc.setAttribute('content',theme==='dark'?'#0C1220':'#1F5BFF');
    try{localStorage.setItem('insu_theme',theme)}catch(e){} },[theme]);
  const toggleTheme=()=>setTheme(t=>t==='dark'?'light':'dark');

  // 부팅: 실제 Supabase 세션만 유지(새로고침 시 홈). 데모/개발자 세션은 유지 안 함(항상 랜딩부터).
  useEffect(()=>{ let alive=true; (async()=>{
    if(isJoin){ const s=seed(); if(alive){ setDb({...s,mode:'demo',session:null}); setRoute('join'); } return; }  // 공개 지원 페이지
    try{ const {data}=await SB.auth.getSession();
      if(data && data.session){ const d=await loadAll(data.session.user.id); if(alive){ setDb(d); setRoute('home'); } return; } }catch(e){}
    const s=seed(); if(alive){ setDb({...s,mode:'demo',session:null}); setRoute('landing'); }  // 데모는 세션 복원 안 함
  })(); return ()=>{alive=false}; },[]);

  // 📩 공개 지원 접수 → Supabase applications 저장. 비로그인 방문자는 익명 인증으로 임시 토큰 받아 insert(anon 직접 insert는 프로젝트 정책상 차단됨).
  const submitApplication = async(app)=>{
    try{
      const {data:sess}=await SB.auth.getSession();
      let anon=false;
      if(!(sess && sess.session)){ const {error}=await SB.auth.signInAnonymously(); if(!error) anon=true; }
      const {error}=await SB.from('applications').insert({name:app.name,phone:app.phone,region:app.region,motive:app.motive,ref_code:app.ref||null});
      if(anon) await SB.auth.signOut();  // 임시 익명세션 정리(현재 사용자 세션엔 영향 없음)
      if(error) return {ok:false,error:error.message};
    }catch(e){ return {ok:false,error:String(e)}; }
    return {ok:true};
  };

  // 데모 모드: 저장할 때 session은 빼고 저장(새로고침해도 개발자/데모로 안 튐)
  const commit = (nd)=>{ setDb({...nd}); if(nd.mode==='real'){ const m=nd.users.find(u=>u.id===nd.session); syncMine(nd,m).catch(()=>{}); } else { const {session,...rest}=nd; DB.save(rest); } };
  const go = (r)=>setRoute(r);

  // 실제 로그인(Supabase, 전화번호+비번)
  const login = async(phone,pw)=>{
    const {data,error}=await SB.auth.signInWithPassword({email:phoneEmail(phone),password:pw});
    if(error) return {error:'전화번호 또는 비밀번호가 올바르지 않습니다'};
    const d=await loadAll(data.user.id); setDb(d); setRoute('home'); return {};
  };
  // 데모 로그인(로컬 샘플) — 세션은 메모리에만(저장 X → 새로고침 시 랜딩)
  const demoLogin = (role)=>{ const s=seed(); const u=s.users.find(x=>x.role===role); const nd={...s,mode:'demo',session:u?u.id:null}; setDb(nd); setRoute('home'); };
  // 실제 회원가입(Supabase)
  const signup = async(p)=>{
    const code=(p.ref||'').trim().toUpperCase();
    let branchId=null,teamId=null,recruiterId=null,myCode=null,grade='FC';
    if(p.role==='branch'){ if(code!==HQ_CODE) return {error:'가입 승인 코드가 아닙니다'}; }
    else if(p.role==='team'){ const {data}=await SB.from('branches').select('*').eq('code',code).maybeSingle(); if(!data) return {error:'지점장 코드를 찾을 수 없습니다'}; branchId=data.id; recruiterId=data.manager_id; }
    else { const {data}=await SB.from('teams').select('*').eq('code',code).maybeSingle(); if(!data) return {error:'팀장 코드를 찾을 수 없습니다'}; teamId=data.id; branchId=data.branch_id; recruiterId=data.leader_id; }
    const {data:au,error:ae}=await SB.auth.signUp({email:phoneEmail(p.phone),password:p.pw});
    if(ae) return {error: /registered|exists/i.test(ae.message)?'이미 가입된 전화번호입니다':ae.message};
    const uid=au.user.id;
    if(p.role==='branch'){ branchId=uuid(); myCode=rid('GN'); grade='PLAT'; const {error}=await SB.from('branches').insert({id:branchId,name:p.name+' 지점',code:myCode,manager_id:uid}); if(error) return {error:'지점 생성 실패: '+error.message}; }
    else if(p.role==='team'){ teamId=uuid(); myCode=rid('TM'); grade='GOLD'; const {error}=await SB.from('teams').insert({id:teamId,branch_id:branchId,name:p.name+' 팀',code:myCode,leader_id:uid}); if(error) return {error:'팀 생성 실패: '+error.message}; }
    const {error:pe}=await SB.from('profiles').insert({id:uid,name:p.name,phone:String(p.phone).replace(/\D/g,''),role:p.role,branch_id:branchId,team_id:teamId,recruiter_id:recruiterId,code:myCode,grade,goal_ape:p.role==='agent'?200:300,consent:p.consent||{}});
    if(pe) return {error:'프로필 생성 실패: '+pe.message};
    const d=await loadAll(uid); setDb(d); setRoute('home'); return {};
  };
  const logout = async()=>{ try{ if(db && db.mode==='real') await SB.auth.signOut(); }catch(e){}
    const s=seed(); setDb({...s,mode:'demo',session:null}); setRoute('landing'); };

  // 현재 실 세션 기준으로 전체 데이터 재적재(관리자가 계정 발급 후 목록 갱신)
  const reload = async()=>{ try{ const {data}=await SB.auth.getSession(); if(data&&data.session){ const d=await loadAll(data.session.user.id); setDb(d); } }catch(e){} };
  // 🔑 관리자 계정 발급 = service_role Edge Function 호출(프론트엔 service_role 없음).
  //   지점장/팀장은 로그인 JWT가 자동 첨부되어 서버가 위계 스코프를 강제한다.
  const svcCreateAccount = async(acc)=>{
    const body={name:acc.name,phone:acc.phone,pw:acc.pw,role:acc.role,branchId:acc.branchId||null,teamId:acc.teamId||null};
    try{
      const {data,error}=await SB.functions.invoke('create-account',{body});
      if(error){ let msg='계정 발급 실패'; try{ const j=await error.context.json(); if(j&&j.error) msg=j.error; }catch(e){} return {error:msg}; }
      if(data&&data.error) return {error:data.error};
      return {ok:true,user:data.user,tempPassword:data.tempPassword};
    }catch(e){ return {error:'네트워크 오류: '+String(e)}; }
  };

  // 🔧 개발자 콘솔 — 왼쪽 상단 그래프 7클릭 + 코드 → 개발자 페이지
  const onDev = ()=>{ const pw=window.prompt('🔧 개발자 페이지 접속 코드'); if(pw==null) return;
    if(pw===DEV_CODE){ demoLogin('hq'); } else flash('코드가 올바르지 않습니다'); };

  if(!db) return <div className="app"><div className="scroll" style={{display:'flex',alignItems:'center',justifyContent:'center'}}><div className="muted">불러오는 중…</div></div></div>;

  const tp={theme,toggleTheme};
  let view;
  if(route==='join') view=<JoinPage go={go} submit={submitApplication} flash={flash} {...tp}/>;
  else if(route==='landing') view=<Landing go={go} onDev={onDev} {...tp}/>;
  else if(route==='login') view=<Login go={go} login={login} demoLogin={demoLogin} flash={flash} {...tp}/>;
  else if(route==='signup') view=<Signup go={go} signup={signup} flash={flash} {...tp}/>;
  else if(route==='terms') view=<Legal kind="terms" go={go}/>;
  else if(route==='privacy') view=<Legal kind="privacy" go={go}/>;
  else if(route==='home' && me && me.role==='hq') view=<Admin db={db} me={me} logout={logout} flash={flash} commit={commit} svcCreateAccount={svcCreateAccount} reload={reload} {...tp}/>;
  else if(route==='home' && me) view=<Home db={db} me={me} logout={logout} flash={flash} commit={commit} svcCreateAccount={svcCreateAccount} reload={reload} {...tp}/>;
  else view=<Landing go={go} onDev={onDev} {...tp}/>;

  return <div className="app">{view}{toast&&<div className="toast">{toast}</div>}</div>;
}

/* ───────── 회원가입 (역할 + 추천인코드 + 약관) ───────── */
function Signup({go,signup,flash,theme,toggleTheme}){
  const [step,setStep]=useState(1);
  const [role,setRole]=useState('agent');
  const [f,setF]=useState({name:'',phone:'',pw:'',ref:''});
  const [agree,setAgree]=useState({tos:false,privacy:false,marketing:false});
  const [err,setErr]=useState(''); const [busy,setBusy]=useState(false);
  const set=(k,v)=>setF({...f,[k]:v});

  // 지점장(본사코드)만 로컬 미리보기, 팀장/설계사 코드는 가입 시 서버 검증
  const refInfo = (()=>{ if(!f.ref) return null; const code=f.ref.trim().toUpperCase();
    if(role==='branch') return code===HQ_CODE?{ok:true,text:'가입 승인 코드 확인 — 새 지점을 개설합니다'}:{ok:false,text:'가입 승인 코드가 아닙니다'};
    return null; })();

  const doSignup=async()=>{
    setErr('');
    if(!f.name||f.phone.length<10||f.pw.length<6){ setStep(2); return setErr('이름·전화번호(10자리↑)·비밀번호(6자리↑)를 확인하세요'); }
    if(!f.ref){ setStep(2); return setErr('추천인 코드를 입력하세요'); }
    if(!agree.tos||!agree.privacy) return setErr('필수 약관에 동의해주세요');
    setBusy(true);
    const res=await signup({role,name:f.name,phone:f.phone,pw:f.pw,ref:f.ref,consent:{...agree,at:Date.now()}});
    setBusy(false);
    if(res.error){ if(/코드/.test(res.error)) setStep(2); return setErr(res.error); }
    flash('가입 완료! 환영합니다 🎉');
  };

  const STEPS=[['역할','👤'],['정보','📝'],['약관','📄']];
  return <div className="scroll auth">
    <ThemeFab theme={theme} toggleTheme={toggleTheme}/>
    <AuthAside/>
    <div className="auth-body">
    <div className="top"><button className="back" onClick={()=>step===1?go('landing'):setStep(step-1)}>‹</button>
      <div style={{fontWeight:800}}>회원가입</div></div>
    <div className="pad" style={{paddingTop:6}}>
    {/* 진행 스텝바 */}
    <div style={{display:'flex',alignItems:'center',marginBottom:22}}>
      {STEPS.map(([lbl],i)=>{const n=i+1;const done=step>n;const cur=step===n;
        return <React.Fragment key={n}>
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:5,flex:'none'}}>
            <div style={{width:30,height:30,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:800,
              background:done?'#12A150':cur?'var(--blue)':'#E4EAF3',color:done||cur?'#fff':'var(--sub)',transition:'.2s'}}>{done?'✓':n}</div>
            <div style={{fontSize:10.5,fontWeight:cur?800:600,color:cur?'var(--blue)':'var(--sub)'}}>{lbl}</div>
          </div>
          {n<3 && <div style={{flex:1,height:2,margin:'0 6px',marginBottom:16,borderRadius:2,background:step>n?'#12A150':'#E4EAF3',transition:'.2s'}}/>}
        </React.Fragment>;})}
    </div>
    {step===1 && <>
      <div style={{width:52,height:52,borderRadius:15,background:'linear-gradient(135deg,#1F5BFF,#38A4FF)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:26,marginBottom:12}}>👤</div>
      <div className="h1" style={{fontSize:22,marginBottom:6}}>어떤 역할로<br/>시작하시나요?</div>
      <div className="muted" style={{marginBottom:18}}>역할에 따라 관리 범위가 달라집니다.</div>
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {['branch','team','agent'].map(r=>(
          <div key={r} className={'rolecard'+(role===r?' on':'')} onClick={()=>setRole(r)} style={{textAlign:'left',display:'flex',alignItems:'center',gap:14}}>
            <div className="ic">{ROLE[r].ic}</div>
            <div><div className="t">{ROLE[r].label}</div><div className="d">{ROLE[r].d}</div></div>
          </div>))}
      </div>
      <div style={{height:20}}/>
      <button className="btn" onClick={()=>setStep(2)}>다음 →</button>
    </>}

    {step===2 && <>
      <div style={{width:52,height:52,borderRadius:15,background:'linear-gradient(135deg,#1F5BFF,#38A4FF)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:26,marginBottom:12}}>📝</div>
      <div className="h1" style={{fontSize:22,marginBottom:4}}>정보를 입력하세요</div>
      <div className="muted" style={{marginBottom:18}}><b style={{color:'var(--blue)'}}>{ROLE[role].label}</b> 계정으로 가입합니다.</div>
      <div className="field"><label>이름</label><input value={f.name} onChange={e=>set('name',e.target.value)} placeholder="홍길동"/></div>
      <div className="field"><label>전화번호 (아이디)</label><input value={f.phone} onChange={e=>set('phone',e.target.value.replace(/\D/g,''))} placeholder="01012345678" inputMode="numeric"/></div>
      <div className="field"><label>비밀번호</label><input type="password" value={f.pw} onChange={e=>set('pw',e.target.value)} placeholder="6자리 이상"/></div>
      <div className="field"><label>추천인 코드 {role==='branch'?'(가입 승인 코드)':role==='team'?'(지점장 코드)':'(팀장 코드)'}</label>
        <input value={f.ref} onChange={e=>set('ref',e.target.value.toUpperCase())} placeholder={role==='branch'?'HQ2026':'예: TM-3C4D'}/>
        {refInfo && <div className={refInfo.ok?'ok':'err'}>{refInfo.ok?'✓ ':'✕ '}{refInfo.text}</div>}
        <div className="muted" style={{fontSize:11,marginTop:6}}>{role==='branch'?'가입 승인 코드 HQ2026 입력':role==='team'?'지점장에게 지점 코드를 받으세요':'팀장에게 팀 코드를 받으세요'}</div>
      </div>
      {err&&<div className="err" style={{marginBottom:10}}>{err}</div>}
      <button className="btn" onClick={()=>{ if(!f.name||f.phone.length<10||f.pw.length<6){return setErr('이름·전화번호·비밀번호(6자리↑)를 확인하세요')} if(!f.ref){return setErr('추천인 코드를 입력하세요')} if(role==='branch'&&f.ref.trim().toUpperCase()!==HQ_CODE){return setErr('가입 승인 코드가 아닙니다')} setErr(''); setStep(3); }}>다음 →</button>
    </>}

    {step===3 && <>
      <div style={{width:52,height:52,borderRadius:15,background:'linear-gradient(135deg,#1F5BFF,#38A4FF)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:26,marginBottom:12}}>📄</div>
      <div className="h1" style={{fontSize:22,marginBottom:4}}>약관에 동의해주세요</div>
      <div className="muted" style={{marginBottom:18}}>안전한 서비스 이용을 위해 필요해요.</div>
      <div className="card">
        <div className="check" onClick={()=>setAgree({tos:!agree.tos&&agree.privacy?true:!(agree.tos&&agree.privacy),privacy:!agree.tos&&agree.privacy?true:!(agree.tos&&agree.privacy),marketing:agree.marketing})} style={{fontWeight:800,borderBottom:'1px solid var(--line)'}}>
          <div className={'box'+(agree.tos&&agree.privacy&&agree.marketing?' on':'')}>✓</div><div>전체 동의</div></div>
        <Ck on={agree.tos} set={()=>setAgree({...agree,tos:!agree.tos})} label="[필수] 이용약관" onView={()=>go('terms')}/>
        <Ck on={agree.privacy} set={()=>setAgree({...agree,privacy:!agree.privacy})} label="[필수] 개인정보 처리방침" onView={()=>go('privacy')}/>
        <Ck on={agree.marketing} set={()=>setAgree({...agree,marketing:!agree.marketing})} label="[선택] 마케팅 정보 수신"/>
      </div>
      {err&&<div className="err" style={{margin:'10px 0'}}>{err}</div>}
      <div style={{height:16}}/>
      <button className="btn blue" disabled={!agree.tos||!agree.privacy||busy} onClick={doSignup}>{busy?'가입 중…':'가입 완료'}</button>
    </>}
    </div>
    </div>
  </div>;
}
function Ck({on,set,label,onView}){
  return <div className="check">
    <div className={'box'+(on?' on':'')} onClick={set}>✓</div>
    <div style={{flex:1}} onClick={set}>{label}</div>
    {onView&&<span className="link" onClick={onView}>보기</span>}
  </div>;
}

/* ───────── 로그인 ───────── */
function Login({go,login,demoLogin,flash,theme,toggleTheme}){
  const [phone,setPhone]=useState(''),[pw,setPw]=useState(''),[err,setErr]=useState(''),[busy,setBusy]=useState(false);
  const submit=async()=>{ setErr(''); if(phone.length<10||!pw)return setErr('전화번호·비밀번호를 입력하세요'); setBusy(true); const res=await login(phone,pw); setBusy(false); if(res.error) setErr(res.error); };
  return <div className="scroll auth">
    <ThemeFab theme={theme} toggleTheme={toggleTheme}/>
    <AuthAside/>
    <div className="auth-body">
    <div className="top"><button className="back" onClick={()=>go('landing')}>‹</button><div style={{fontWeight:800}}>로그인</div></div>
    <div className="pad">
      {/* 🎬 인트로 영상(애니메이션) — 모바일에서만(PC는 좌측 패널) */}
      <div className="only-mobile" style={{marginBottom:16}}><IntroVideo radius={18}/></div>
      <div className="h1" style={{fontSize:22,marginBottom:6}}>다시 오신 것을<br/>환영합니다</div>
      <div className="muted" style={{marginBottom:20}}>보험 전문가 계정으로 로그인하세요.</div>
      <div className="field"><label>전화번호 (아이디)</label><input value={phone} onChange={e=>setPhone(e.target.value.replace(/\D/g,''))} placeholder="01012345678" inputMode="numeric"/></div>
      <div className="field"><label>비밀번호</label><input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="비밀번호"/></div>
      {err&&<div className="err" style={{marginBottom:10}}>{err}</div>}
      <button className="btn" disabled={busy} onClick={submit}>{busy?'로그인 중…':'로그인'}</button>
      <div style={{textAlign:'center',margin:'18px 0',color:'#9AA6BE',fontSize:12}}>— 데모 계정으로 둘러보기(로컬) —</div>
      <div className="row" style={{gap:8}}>
        <button className="btn ghost" style={{height:44,fontSize:13}} onClick={()=>demoLogin('branch')}>지점장</button>
        <button className="btn ghost" style={{height:44,fontSize:13}} onClick={()=>demoLogin('team')}>팀장</button>
        <button className="btn ghost" style={{height:44,fontSize:13}} onClick={()=>demoLogin('agent')}>설계사</button>
      </div>
      <div style={{textAlign:'center',marginTop:18,fontSize:13,color:'var(--sub)'}}>계정이 없으신가요? <span className="link" onClick={()=>go('signup')}>회원가입</span></div>
    </div>
    </div>
  </div>;
}

/* ───────── 이용약관 / 개인정보 처리방침 ───────── */
function Legal({kind,go}){
  const T = kind==='terms'
   ? {title:'이용약관', body:`제1조 (목적)\n본 약관은 인슈런스 석세스 프로그램(이하 "서비스")의 이용 조건 및 절차, 회사와 회원의 권리·의무를 규정합니다.\n\n제2조 (정의)\n1. "회원"이란 역할(지점장·팀장·설계사)로 가입하여 서비스를 이용하는 자를 말합니다.\n2. "추천인 코드"란 상위 조직(본사·지점장·팀장)에의 소속을 연결하는 코드입니다.\n\n제3조 (서비스의 내용)\n고객관리, 매출·업적관리, 리쿠르팅·정착관리, 승급관리, 병원(청구지원)·기념일 관리 등을 제공합니다.\n\n제4조 (회원의 의무)\n회원은 고객의 개인정보 및 보험계약 정보를 관계 법령에 따라 안전하게 취급해야 합니다.\n\n제5조 (계약 해지)\n회원은 언제든 탈퇴할 수 있으며, 관계 법령이 정한 기간 동안 보관이 필요한 정보는 예외로 합니다.\n\n※ 본 약관은 시안이며 정식 서비스 출시 전 법무 검토 후 확정됩니다.`}
   : {title:'개인정보 처리방침', body:`인슈런스 석세스 프로그램(이하 "회사")은 개인정보보호법 등 관계 법령을 준수합니다.\n\n1. 수집 항목\n- 회원: 이름, 휴대폰번호, 비밀번호, 역할, 소속(추천인 코드), 동의 이력\n- 고객관리 목적: 회원이 입력하는 고객 정보(생일·기념일·계약 등)\n\n2. 이용 목적\n영업 관리, 조직(지점·팀) 위계 구성, 유지율·정착률 향상을 위한 알림·통계 제공.\n\n3. 보유 기간\n회원 탈퇴 시 지체 없이 파기하되, 관계 법령에 따라 일정 기간 보관할 수 있습니다.\n\n4. 제3자 제공\n법령에 근거하거나 회원의 동의가 있는 경우를 제외하고 제공하지 않습니다.\n\n5. 이용자 권리\n이용자는 자신의 개인정보 열람·정정·삭제·처리정지를 요청할 수 있습니다.\n\n6. 개인정보 보호책임자\n(정식 출시 시 지정·공개)\n\n※ 본 방침은 시안이며 정식 출시 전 법무 검토 후 확정됩니다.`};
  return <div className="scroll">
    <div className="top"><button className="back" onClick={()=>go('signup')}>‹</button><div style={{fontWeight:800}}>{T.title}</div></div>
    <div className="pad"><div className="legal">{T.body}</div></div>
  </div>;
}

/* ───────── 홈 (역할별 스코프) ───────── */
function Home({db,me,logout,flash,commit,theme,toggleTheme,svcCreateAccount,reload}){
  const [tab,setTab]=useState('home');
  const [openCust,setOpenCust]=useState(null); // 고객 상세 id
  const [addCust,setAddCust]=useState(false);
  const branch=db.branches.find(b=>b.id===me.branchId);
  const team=db.teams.find(t=>t.id===me.teamId);

  // 역할별 가시 범위
  const scopeUsers = db.users.filter(u=>{
    if(me.role==='agent') return u.id===me.id;
    if(me.role==='team')  return u.teamId===me.teamId;
    return u.branchId===me.branchId; // branch
  });
  const agents = scopeUsers.filter(u=>u.role==='agent');
  const myCustomers = db.customers.filter(c=>scopeUsers.some(u=>u.id===c.ownerId));
  const todos = buildTodos(myCustomers);

  // 고객 저장/수정/액션
  const saveCustomer=(cst)=>{ const nd={...db,customers:[...db.customers]};
    const i=nd.customers.findIndex(x=>x.id===cst.id);
    if(i>=0) nd.customers[i]=cst; else nd.customers.push({...cst,id:uuid(),ownerId:me.id});
    commit(nd); };
  const markContact=(cid)=>{ const nd={...db,customers:db.customers.map(c=>c.id===cid?{...c,lastContact:new Date().toISOString().slice(0,10)}:c)}; commit(nd); flash('연락 완료로 기록했어요 ✓'); };

  if(addCust) return <CustomerForm me={me} onSave={(c)=>{saveCustomer(c);setAddCust(false);flash('고객 등록 완료 ✓');}} onCancel={()=>setAddCust(false)}/>;
  if(openCust){ const c=db.customers.find(x=>x.id===openCust); if(c) return <CustomerDetail c={c} onBack={()=>setOpenCust(null)} onContact={()=>markContact(c.id)} onSave={(nc)=>{saveCustomer(nc);flash('저장됨 ✓');}}/>; }

  return <div className="scroll app-main" style={{paddingBottom:0,minHeight:'100dvh',display:'flex',flexDirection:'column'}}>
    <div className="pad" style={{flex:1,overflowY:'auto'}}>
      <div className="row" style={{justifyContent:'space-between'}}>
        <div><div style={{fontWeight:900,fontSize:18}}>{me.name} <span className={'chip '+ROLE[me.role].chip}>{ROLE[me.role].label}</span></div>
          <div className="muted" style={{fontSize:12.5}}>{branch?branch.name:''}{team?' · '+team.name:''}</div></div>
        <div className="row" style={{gap:8}}>
          <button className="back" onClick={toggleTheme} title="다크/라이트">{theme==='dark'?'☀️':'🌙'}</button>
          <button className="back" onClick={logout} title="로그아웃"><IcLogout/></button>
        </div>
      </div>

      {tab==='home' && (()=>{
        const allC=myCustomers.flatMap(c=>c.contracts||[]);
        const ret=allC.length?Math.round(allC.filter(x=>x.status==='정상').length/allC.length*100):100;
        const sum={}; todos.forEach(t=>{sum[t.type]=(sum[t.type]||0)+1;});
        return <div className="home-dash">
        <div className="hd-stats row" style={{gap:10,marginTop:16}}>
          {me.role==='agent'
            ? <><div className="stat"><div className="v">{todos.length}</div><div className="l">오늘 할 일</div></div>
                <div className="stat"><div className="v" style={{color:ret<80?'#E23B4E':'inherit'}}>{ret}%</div><div className="l">내 유지율</div></div>
                <div className="stat"><div className="v">{myCustomers.length}</div><div className="l">관리 고객</div></div></>
            : <><div className="stat"><div className="v">{agents.length}</div><div className="l">{me.role==='branch'?'지점 설계사':'팀원'}</div></div>
                <div className="stat"><div className="v">{myCustomers.length}</div><div className="l">지점 고객</div></div>
                <div className="stat"><div className="v" style={{color:ret<80?'#E23B4E':'inherit'}}>{ret}%</div><div className="l">평균 유지율</div></div></>}
        </div>

        <div className="hd-main">
        <div className="row" style={{justifyContent:'space-between',margin:'18px 0 8px'}}>
          <div style={{fontWeight:900,fontSize:16}}>💡 오늘의 할 일 <span style={{color:'var(--blue)'}}>{todos.length}</span></div>
          {me.role==='agent'&&<button className="chip tag-branch" onClick={()=>setAddCust(true)}>＋ 고객</button>}
        </div>
        {todos.length===0
          ? <div className="card"><div className="muted">오늘 급한 할 일이 없어요. 고객을 등록하면 생일·기념일·미납·만기·병원 케어가 자동으로 잡혀요.</div></div>
          : <div className="card" style={{padding:'2px 14px'}}>
              {todos.slice(0,20).map((it,i)=><div key={i} className="listrow" onClick={()=>setOpenCust(it.cust.id)}>
                <div style={{width:34,height:34,borderRadius:10,background:it.color+'1A',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,flex:'none'}}>{it.icon}</div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:13.5}}>{it.cust.name} <span style={{color:'var(--sub)',fontWeight:600}}>· {it.text}</span></div>
                  <div style={{fontSize:11}}><span style={{color:it.color,fontWeight:800}}>{it.type}</span></div>
                </div>
                <div style={{fontSize:11,fontWeight:900,color:it.color}}>{ddLabel(it.dd)}</div>
              </div>)}
            </div>}
        </div>

        <aside className="hd-side">
        {todos.length>0 && <div className="card" style={{marginTop:18}}>
          <div style={{fontWeight:800,marginBottom:4,fontSize:14}}>📌 할 일 유형별</div>
          {Object.entries(sum).map(([k,v])=><div key={k} className="row" style={{justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid var(--line)'}}>
            <span className="muted" style={{fontSize:13}}>{k}</span><b style={{fontSize:14}}>{v}</b></div>)}
        </div>}
        {me.role!=='agent' && <div className="codebox" style={{marginTop:16}}>
          <div style={{fontSize:12,opacity:.8}}>내 추천인 코드 (하위 초대용)</div>
          <div className="c">{me.code||'-'}</div>
          <div style={{fontSize:11,opacity:.7,marginTop:4}}>{me.role==='branch'?'팀장':'설계사'}가 이 코드로 가입하면 자동 소속됩니다</div>
        </div>}
        </aside>
      </div>;})()}

      {tab==='docs' && <Documents db={db} me={me} scopeUsers={scopeUsers} commit={commit} flash={flash}/>}

      {tab==='org' && <OrgView db={db} me={me} commit={commit} flash={flash} svcCreateAccount={svcCreateAccount} reload={reload}/>}

          <div className="listrow" onClick={()=>setTab('claims')}><div style={{flex:1,fontWeight:700}}>🏥 병원 · 실손청구</div><span style={{color:'var(--blue)',fontWeight:800}}>›</span></div>
          <div className="listrow" onClick={()=>setTab('docs')}><div style={{flex:1,fontWeight:700}}>🗂️ 자료 보관함</div><span style={{color:'var(--blue)',fontWeight:800}}>›</span></div>
          <div className="listrow" onClick={()=>setTab('promotion')}><div style={{flex:1,fontWeight:700}}>🏅 승급 · 직급</div><span style={{color:'var(--blue)',fontWeight:800}}>›</span></div>
          <div className="listrow" onClick={()=>setTab('community')}><div style={{flex:1,fontWeight:700}}>📚 커뮤니티 · 자료실</div><span style={{color:'var(--blue)',fontWeight:800}}>›</span></div>
          <div className="listrow" style={{borderBottom:'none'}}><div style={{flex:1,fontWeight:700}}>내 추천인 코드</div><b>{me.code||'—'}</b></div>
        </div>
        <div style={{height:12}}/>
        <button className="btn ghost" onClick={logout}>로그아웃</button>
        <div className="muted" style={{textAlign:'center',marginTop:16,fontSize:11}}>ⓘ 지금은 프론트(로컬 저장) 단계 · 백엔드(로그인·데이터)는 다음 순서</div>
      </div>}
    </div>

    <div className="nav">
      <button className={tab==='home'?'on':''} onClick={()=>setTab('home')}><span className="ic">🏠</span>홈</button>
      <button className={tab==='customers'?'on':''} onClick={()=>setTab('customers')}><span className="ic">🧑‍🤝‍🧑</span>고객</button>
      <button className={tab==='performance'?'on':''} onClick={()=>setTab('performance')}><span className="ic">📈</span>실적</button>
      {me.role!=='agent' && <button className={tab==='org'?'on':''} onClick={()=>setTab('org')}><span className="ic">👥</span>{me.role==='branch'?'조직':'팀'}</button>}
      <button className={tab==='more'?'on':''} onClick={()=>setTab('more')}><span className="ic">⋯</span>더보기</button>
    </div>
  </div>;
}

/* ───────── 고객 리스트 ───────── */
function CustomerList({customers,me,onOpen,onAdd}){
  const [q,setQ]=useState('');
  const list=customers.filter(c=>!q||c.name.includes(q)||(c.job||'').includes(q));
  const badge=(c)=>{ if((c.contracts||[]).some(x=>x.unpaid>=2))return{t:'실효위험',col:'#E23B4E'};
    if((c.contracts||[]).some(x=>x.unpaid>=1))return{t:'미납',col:'#C97A00'};
    if(c.surgery&&daysSince(c.surgery)>=0&&daysSince(c.surgery)<=14)return{t:'병원케어',col:'#7A5BFF'};
    const bd=ddayAnnual(c.birthday); if(bd!==null&&bd<=7)return{t:'생일 D-'+bd,col:'#12A150'};
    return null; };
  return <div style={{marginTop:16}}>
    <div className="row" style={{justifyContent:'space-between',marginBottom:12}}>
      <div style={{fontWeight:900,fontSize:17}}>🧑‍🤝‍🧑 고객관리 <span style={{color:'var(--blue)'}}>{customers.length}</span></div>
      {me.role==='agent'&&<button className="chip tag-branch" onClick={onAdd}>＋ 고객 등록</button>}
    </div>
    <div className="field"><input value={q} onChange={e=>setQ(e.target.value)} placeholder="이름·직업 검색"/></div>
    <div className="card" style={{padding:'2px 14px'}}>
      {list.length?list.map(c=>{const b=badge(c);return <div key={c.id} className="listrow" onClick={()=>onOpen(c.id)}>
        <div className="ava">{c.name[0]}</div>
        <div style={{flex:1}}><div style={{fontWeight:700,fontSize:14}}>{c.name} <span className="muted" style={{fontSize:11.5}}>{c.job}</span></div>
          <div className="muted" style={{fontSize:11.5}}>{(c.contracts||[]).map(x=>x.product).join(', ')||'계약 없음'}</div></div>
        {b&&<span className="chip" style={{background:b.col+'1A',color:b.col,fontSize:10}}>{b.t}</span>}
        <div style={{color:'var(--blue)',fontWeight:800}}>›</div>
      </div>;}):<div className="muted" style={{padding:'14px 0'}}>고객이 없습니다.</div>}
    </div>
    {me.role!=='agent'&&<div className="muted" style={{textAlign:'center',fontSize:11,marginTop:10}}>ⓘ {me.role==='branch'?'지점':'팀'} 소속 설계사의 고객을 조회합니다</div>}
  </div>;
}

/* ───────── 고객 등록/수정 폼 ───────── */
function CustomerForm({me,cust,onSave,onCancel}){
  const init=cust||{name:'',job:'',income:'',birthday:'',anniversary:'',childbirth:'',surgery:'',discharge:'',lastContact:new Date().toISOString().slice(0,10),memo:'',contracts:[{product:'',monthly:'',status:'정상',unpaid:0,maturity:''}]};
  const [f,setF]=useState(init); const [err,setErr]=useState('');
  const s=(k,v)=>setF({...f,[k]:v});
  const sc=(k,v)=>{const cs=[...(f.contracts||[{}])];cs[0]={...cs[0],[k]:v};setF({...f,contracts:cs})};
  const ct=(f.contracts&&f.contracts[0])||{};
  const submit=()=>{ if(!f.name)return setErr('이름을 입력하세요');
    onSave({...f,income:+f.income||0,contracts:(f.contracts||[]).filter(x=>x.product).map(x=>({...x,monthly:+x.monthly||0,unpaid:+x.unpaid||0}))}); };
  const F=(label,k,ph,type)=><div className="field"><label>{label}</label><input type={type||'text'} value={f[k]||''} onChange={e=>s(k,e.target.value)} placeholder={ph}/></div>;
  return <div className="scroll">
    <div className="top"><button className="back" onClick={onCancel}>‹</button><div style={{fontWeight:800}}>{cust?'고객 수정':'고객 등록'}</div></div>
    <div className="pad" style={{paddingTop:4}}>
      {F('이름 *','name','홍길동')}
      {F('하는 일 (직업)','job','자영업 (카페 운영)')}
      {F('월 수입 (만원)','income','450','number')}
      <div className="row" style={{gap:10}}><div style={{flex:1}}>{F('생일','birthday','','date')}</div><div style={{flex:1}}>{F('결혼기념일','anniversary','','date')}</div></div>
      {F('출산(예정)일','childbirth','','date')}
      <div className="row" style={{gap:10}}><div style={{flex:1}}>{F('수술일','surgery','','date')}</div><div style={{flex:1}}>{F('퇴원일','discharge','','date')}</div></div>
      {F('마지막 연락일','lastContact','','date')}
      <div className="card" style={{margin:'4px 0 14px'}}>
        <div style={{fontWeight:800,marginBottom:10}}>계약 정보</div>
        <div className="field" style={{marginBottom:10}}><label>상품</label><input value={ct.product||''} onChange={e=>sc('product',e.target.value)} placeholder="암보험 · 실손보험"/></div>
        <div className="row" style={{gap:10}}>
          <div style={{flex:1}} className="field"><label>월납(만원)</label><input type="number" value={ct.monthly||''} onChange={e=>sc('monthly',e.target.value)}/></div>
          <div style={{flex:1}} className="field"><label>상태</label><select value={ct.status||'정상'} onChange={e=>sc('status',e.target.value)}><option>정상</option><option>미납</option><option>실효</option></select></div>
        </div>
        <div className="row" style={{gap:10}}>
          <div className="field" style={{flex:1,marginBottom:0}}><label>미납 개월</label><input type="number" value={ct.unpaid||0} onChange={e=>sc('unpaid',e.target.value)}/></div>
          <div className="field" style={{flex:1,marginBottom:0}}><label>만기/갱신일</label><input type="date" value={ct.maturity||''} onChange={e=>sc('maturity',e.target.value)}/></div>
        </div>
      </div>
      <div className="field"><label>메모</label><input value={f.memo||''} onChange={e=>s('memo',e.target.value)} placeholder="특이사항"/></div>
      {err&&<div className="err" style={{marginBottom:10}}>{err}</div>}
      <button className="btn blue" onClick={submit}>{cust?'저장':'등록'}</button>
    </div>
  </div>;
}

/* ───────── 고객 상세 ───────── */

  if(edit) return <CustomerForm cust={c} onSave={(nc)=>{onSave(nc);setEdit(false);}} onCancel={()=>setEdit(false)}/>;
  const dchips=[];
  const bd=ddayAnnual(c.birthday); if(bd!==null)dchips.push(['🎂 생일',ddLabel(bd),'#12A150']);
  const an=ddayAnnual(c.anniversary); if(an!==null)dchips.push(['💍 결혼기념일',ddLabel(an),'#12A150']);

  const dc=ddayAbs(c.discharge); if(dc!==null)dchips.push(['🏥 퇴원',ddLabel(dc),'#7A5BFF']);
  return <div className="scroll">
    <div className="top"><button className="back" onClick={onBack}>‹</button><div style={{fontWeight:800,flex:1}}>고객 상세</div>
      <button className="chip tag-branch" onClick={()=>setEdit(true)}>수정</button></div>
    <div className="pad" style={{paddingTop:4}}>
      <div className="row"><div className="ava" style={{width:52,height:52,fontSize:20}}>{c.name[0]}</div>
        <div><div style={{fontWeight:900,fontSize:19}}>{c.name}</div><div className="muted">{c.job} {c.income?'· 월 '+won(c.income):''}</div></div></div>
      {dchips.length>0 && <div style={{display:'flex',flexWrap:'wrap',gap:8,marginTop:16}}>
        {dchips.map((d,i)=><div key={i} className="chip" style={{background:d[2]+'1A',color:d[2],fontSize:12,padding:'7px 12px'}}>{d[0]} {d[1]}</div>)}</div>}
      {c.surgery && <div className="card" style={{marginTop:14,borderLeft:'4px solid #7A5BFF'}}>
        <div style={{fontWeight:800}}>🏥 병원 케어 · 실손 청구 안내</div>
        <div className="muted" style={{fontSize:12.5,marginTop:4}}>수술일 {c.surgery}{c.discharge?' · 퇴원 '+c.discharge:''}. 필요서류: 진단서(50만원↓ 입퇴원확인서)·진료비 세부내역서·영수증.</div></div>}
      <div style={{fontWeight:800,margin:'18px 0 8px'}}>계약</div>
      {(c.contracts||[]).map((x,i)=><div key={i} className="card" style={{marginBottom:8}}>
        <div className="row" style={{justifyContent:'space-between'}}><b>{x.product}</b>
          <span className="chip" style={{background:x.unpaid>=1?'#E23B4E1A':'#12A1501A',color:x.unpaid>=1?'#E23B4E':'#12A150',fontSize:11}}>{x.unpaid>=1?x.unpaid+'개월 미납':'정상'}</span></div>
        <div className="muted" style={{fontSize:12,marginTop:4}}>월납 {x.monthly}만원{x.maturity?' · 만기/갱신 '+x.maturity:''}</div></div>)}
      {c.memo&&<div className="card" style={{marginTop:8}}><div className="muted" style={{fontSize:12.5}}>📝 {c.memo}</div></div>}
      <div style={{height:16}}/>
      <button className="btn" onClick={onContact}>📞 연락 완료로 기록</button>
      <div className="muted" style={{textAlign:'center',fontSize:11.5,marginTop:10}}>마지막 연락 {c.lastContact||'-'}</div>
    </div>
  </div>;

/* ───────── 리쿠르팅: 퍼널·정착률·역산·13주 신인관리·파이프라인 ───────── */
function Recruiting({db,me,commit,flash}){
  const inScope=(r)=> me.role==='branch' ? r.branchId===me.branchId : r.teamId===me.teamId;
  const recs=db.recruits.filter(inScope);
  const byStage=(s)=>recs.filter(r=>r.stage===s);
  const post = byStage('위촉').length+byStage('교육').length+byStage('정착').length;
  const settleRate = post>0 ? Math.round(byStage('정착').length/post*100) : 0;
  const [addOpen,setAddOpen]=useState(false);
  const [nf,setNf]=useState({name:'',phone:'',source:'지인소개'});
  const sc={가망:'#5B6781',면접:'#C97A00',위촉:'#1F5BFF',교육:'#7A5BFF',정착:'#12A150'};

  // 📩 공개 지원함(applications) — 실 모드에서만 로드(신규 상태만)
  const [apps,setApps]=useState([]);
  const loadApps=async()=>{ if(db.mode!=='real'){ setApps([]); return; }
    try{ const {data}=await SB.from('applications').select('*').eq('status','신규').order('created_at',{ascending:false}); setApps(data||[]); }catch(e){} };
  useEffect(()=>{ loadApps(); },[]);
  const acceptApp=async(a)=>{
    const nr={id:uuid(),ownerId:me.id,branchId:me.branchId,teamId:me.role==='team'?me.teamId:(db.teams.find(t=>t.branchId===me.branchId)||{}).id,
      name:a.name,phone:a.phone||'',stage:'가망',source:'지원',addedAt:new Date().toISOString().slice(0,10)};
    commit({...db,recruits:[...db.recruits,nr]});
    try{ await SB.from('applications').update({status:'연락',assigned_to:me.id}).eq('id',a.id); }catch(e){}
    setApps(apps.filter(x=>x.id!==a.id)); flash(a.name+' → 리쿠르팅 가망으로 전환 ✓');
  };
  const dismissApp=async(a)=>{ try{ await SB.from('applications').update({status:'보류'}).eq('id',a.id); }catch(e){} setApps(apps.filter(x=>x.id!==a.id)); };

  const advance=(r)=>{ const i=REC_STAGES.indexOf(r.stage); if(i>=REC_STAGES.length-1)return;
    commit({...db,recruits:db.recruits.map(x=>x.id===r.id?{...x,stage:REC_STAGES[i+1]}:x)}); flash(r.name+' → '+REC_STAGES[i+1]); };
  const addRec=()=>{ if(!nf.name)return flash('이름을 입력하세요');
    commit({...db,recruits:[...db.recruits,{id:uuid(),ownerId:me.id,branchId:me.branchId,
      teamId:me.role==='team'?me.teamId:(db.teams.find(t=>t.branchId===me.branchId)||{}).id,
      name:nf.name,phone:nf.phone,stage:'가망',source:nf.source,addedAt:new Date().toISOString().slice(0,10)}]});
    setNf({name:'',phone:'',source:'지인소개'}); setAddOpen(false); flash('후보 등록 ✓'); };
  const targetSettle=5, needAppoint = settleRate>0 ? Math.ceil(targetSettle/(settleRate/100)) : '-';

  return <div>
    {/* 📩 공개 지원함 — 새 지원자를 리쿠르팅 가망으로 */}
    {apps.length>0 && <div className="card" style={{marginBottom:12,border:'2px solid #1F5BFF',background:'var(--soft)'}}>
      <div className="row" style={{justifyContent:'space-between'}}>
        <b>📩 새 지원 <span style={{color:'var(--blue)'}}>{apps.length}</span></b>
        <span className="muted" style={{fontSize:11}}>홈페이지 상담 신청</span></div>
      <div style={{marginTop:8}}>
        {apps.map(a=><div key={a.id} className="row" style={{padding:'9px 0',borderTop:'1px solid var(--line)'}}>
          <div className="ava" style={{background:'#1F5BFF'}}>{(a.name||'?')[0]}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontWeight:700,fontSize:13.5}}>{a.name} <span className="muted" style={{fontSize:11}}>{a.region||''}</span></div>
            <div className="muted" style={{fontSize:11,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{a.phone} · {a.motive||'상담 신청'}</div></div>
          <button className="chip tag-branch" onClick={()=>acceptApp(a)}>＋가망</button>
          <button onClick={()=>dismissApp(a)} style={{color:'var(--sub)',fontSize:16,marginLeft:4}}>✕</button>
        </div>)}
      </div>
    </div>}
    {db.mode!=='real' && <div className="muted" style={{fontSize:11,marginBottom:12,textAlign:'center'}}>ⓘ 홈페이지(?join) 지원자는 실제 로그인 시 여기에 표시됩니다</div>}

    <div className="card"><b>리쿠르팅 퍼널</b>
      <div style={{display:'flex',gap:6,marginTop:12}}>
        {REC_STAGES.map(s=>{const n=byStage(s).length;return <div key={s} style={{flex:1,textAlign:'center'}}>
          <div style={{height:6,borderRadius:3,background:sc[s]}}/>
          <div style={{fontWeight:900,fontSize:17,marginTop:6,color:sc[s]}}>{n}</div>
          <div className="muted" style={{fontSize:10.5}}>{s}</div></div>;})}</div></div>

    <div className="row" style={{gap:10,marginTop:12,alignItems:'stretch'}}>
      <div className="stat" style={{flex:1}}><div className="v" style={{color:settleRate<50?'#E23B4E':'#12A150'}}>{settleRate}%</div><div className="l">정착률</div></div>
      <div className="card" style={{flex:2,display:'flex',flexDirection:'column',justifyContent:'center'}}>
        <div style={{fontWeight:800,fontSize:13}}>🎯 퍼널 역산</div>
        <div className="muted" style={{fontSize:12,marginTop:3}}>정착 <b>{targetSettle}명</b> 목표 → 위촉 <b style={{color:'var(--blue)'}}>{needAppoint}명</b> 필요</div></div></div>

    {byStage('교육').length>0 && <div className="card" style={{marginTop:12}}>
      <b>🎓 신인 13주 도입 관리</b>
      {byStage('교육').map(r=>{const w=r.weekAct||[];const avg=w.length?w.reduce((a,b)=>a+b,0)/w.length:0;const risk=avg<2.5;
        return <div key={r.id} style={{marginTop:10,paddingTop:10,borderTop:'1px solid var(--line)'}}>
          <div className="row" style={{justifyContent:'space-between'}}><b>{r.name}</b>
            {risk?<span className="chip" style={{background:'#E23B4E1A',color:'#E23B4E',fontSize:10.5}}>⚠️ 정착 위험</span>:<span className="chip tag-team" style={{fontSize:10.5}}>정상</span>}</div>
          <div className="row" style={{gap:4,marginTop:8,alignItems:'flex-end',height:44}}>{w.map((a,i)=><div key={i} style={{flex:1,textAlign:'center'}}>
            <div style={{height:Math.max(4,a*9),borderRadius:3,background:a<2?'#E23B4E':'#1F5BFF',marginBottom:3}}/>
            <div className="muted" style={{fontSize:9}}>{i+1}주</div></div>)}</div>
          <div className="muted" style={{fontSize:11,marginTop:4}}>주간 활동(TA/면담) 평균 {avg.toFixed(1)}건 {risk?'· 활동 독려 필요':''}</div>
        </div>;})}</div>}

    <div className="row" style={{justifyContent:'space-between',margin:'16px 0 8px'}}>
      <b>후보 파이프라인 ({recs.length})</b>
      <button className="chip tag-branch" onClick={()=>setAddOpen(!addOpen)}>＋ 후보</button></div>
    {addOpen && <div className="card" style={{marginBottom:10}}>
      <div className="field" style={{marginBottom:8}}><input value={nf.name} onChange={e=>setNf({...nf,name:e.target.value})} placeholder="후보 이름"/></div>
      <div className="row" style={{gap:8}}>
        <input style={{flex:1,height:46,border:'1.5px solid var(--line)',borderRadius:11,padding:'0 12px'}} value={nf.phone} onChange={e=>setNf({...nf,phone:e.target.value})} placeholder="연락처"/>
        <select style={{height:46,border:'1.5px solid var(--line)',borderRadius:11,padding:'0 10px',background:'var(--field)'}} value={nf.source} onChange={e=>setNf({...nf,source:e.target.value})}><option>지인소개</option><option>채용공고</option><option>DB</option></select></div>
      <button className="btn" style={{height:46,marginTop:10}} onClick={addRec}>등록</button></div>}
    <div className="card" style={{padding:'2px 14px'}}>
      {recs.length?recs.map(r=><div key={r.id} className="listrow">
        <div className="ava" style={{background:sc[r.stage]}}>{r.name[0]}</div>
        <div style={{flex:1}}><div style={{fontWeight:700,fontSize:14}}>{r.name} <span className="chip" style={{background:sc[r.stage]+'1A',color:sc[r.stage],fontSize:10}}>{r.stage}</span></div>
          <div className="muted" style={{fontSize:11.5}}>{r.source} · {r.phone}</div></div>

function Members({db,me,commit,flash}){
  const [mode,setMode]=useState(me.role==='branch'?'team':'agent');

  const addTeam=(name)=>{ if(!name)return; commit({...db,teams:[...db.teams,{id:uuid(),branchId:me.branchId,name,code:rid('TM'),leaderId:null}]}); flash('팀 추가됨'); };
  const assignUser=(uid,teamId)=>{ const t=db.teams.find(x=>x.id===teamId); commit({...db,users:db.users.map(u=>u.id===uid?{...u,teamId,branchId:t?t.branchId:u.branchId}:u)}); flash('팀 이동 완료 ✓'); };
  // 지점장=팀장/설계사, 팀장=설계사만 생성
  const createAccount=async(acc)=>{ if(db.users.find(u=>u.phone===acc.phone)){flash('이미 있는 전화번호');return false;}
    // 실모드: service_role Edge Function 으로 실제 로그인 계정 발급(서버가 위계 스코프 강제) → 재적재
    if(db.mode==='real'){
      const r=await svcCreateAccount({name:acc.name,phone:acc.phone,pw:acc.pw,role:acc.role,teamId:acc.teamId||(me.role==='team'?me.teamId:null)});
      if(r.error){ flash(r.error); return false; }
      await reload();
      flash(`계정 발급 ✓  아이디 ${acc.phone} / 비번 ${acc.pw}`);
      return true;
    }
    // 데모: 로컬 즉시 생성
    const uid=uuid(); const code=acc.role==='team'?rid('TM'):null;
    const nu={id:uid,name:acc.name,phone:acc.phone,pw:acc.pw,role:acc.role,branchId:me.branchId,teamId:acc.teamId||(me.role==='team'?me.teamId:null),
      recruiterId:me.id,code,grade:acc.role==='team'?'GOLD':'FC',goalApe:200,consent:{tos:true,privacy:true,at:Date.now()}};
    const nd={...db,users:[...db.users,nu]};
    if(acc.role==='team'&&acc.teamId) nd.teams=nd.teams.map(t=>t.id===acc.teamId?{...t,leaderId:uid}:t);
    commit(nd);
    flash(`계정 생성 ✓  아이디 ${acc.phone} / 비번 ${acc.pw}`);
    return true;
  };

  return <div>

      {me.role==='branch' && <button className="chip tag-team" onClick={()=>{const n=window.prompt('새 팀 이름');if(n)addTeam(n);}}>＋팀</button>}
      <button className="chip tag-branch" onClick={()=>setModal({type:'account'})}>＋계정 생성</button>
    </div>

    {me.role==='branch' && <div className="seg" style={{marginBottom:14}}>
      <button className={mode==='team'?'on':''} onClick={()=>setMode('team')}>팀별 보기</button>
      <button className={mode==='agent'?'on':''} onClick={()=>setMode('agent')}>전체 설계사</button>
    </div>}

    {me.role==='branch'&&mode==='team' && teams.map(t=>{
      const ms=agentsOf(t.id); const lead=db.users.find(u=>u.id===t.leaderId);
      return <div key={t.id} className="card" style={{marginBottom:12}}>
        <div className="row" style={{justifyContent:'space-between'}}>
          <div><b>{t.name}</b> <span className="chip tag-team">{ms.length}명</span></div>
          <div className="muted" style={{fontSize:12}}>팀장 {lead?lead.name:'미지정'}</div></div>
        <div style={{marginTop:8}}>{ms.length?ms.map(a=><div key={a.id} className="row" style={{justifyContent:'space-between',padding:'8px 4px',borderTop:'1px solid var(--line)'}}>
          <div className="row" style={{gap:10}}><div className="ava" style={{width:34,height:34,fontSize:13}}>{a.name[0]}</div><div style={{fontWeight:700,fontSize:13.5}}>{a.name}</div></div>
          <button onClick={()=>setModal({type:'assign',user:a})} style={{fontSize:11.5,color:'var(--blue)',fontWeight:700}}>팀 이동</button></div>):<div className="muted" style={{fontSize:12.5,padding:'8px 0'}}>팀원이 없습니다</div>}</div>
      </div>;
    })}

    {(mode==='agent'||me.role==='team') && <div className="card">
      <div style={{fontWeight:800,marginBottom:4}}>{me.role==='branch'?'지점 전체 설계사':'팀원'} ({allAgents.length})</div>

        <div className="row" style={{gap:11}}><div className="ava">{a.name[0]}</div>
          <div><div style={{fontWeight:700,fontSize:14}}>{a.name}</div><div className="muted" style={{fontSize:11}}>{(db.teams.find(t=>t.id===a.teamId)||{}).name||'미배정'}</div></div></div>
        <button onClick={()=>setModal({type:'assign',user:a})} style={{fontSize:11.5,color:'var(--blue)',fontWeight:700}}>팀 이동</button></div>):<div className="muted" style={{padding:'8px 0'}}>설계사가 없습니다</div>}
    </div>}

    {modal && <MemberModal db={db} me={me} m={modal} onClose={()=>setModal(null)} createAccount={createAccount} assignUser={assignUser}/>}
  </div>;
}
// 지점장/팀장용 계정생성·팀이동 모달
function MemberModal({db,me,m,onClose,createAccount,assignUser}){
  const teams=db.teams.filter(t=>t.branchId===me.branchId);
  const [f,setF]=useState({name:'',phone:'',pw:'',role:me.role==='branch'?'agent':'agent',teamId:me.role==='team'?me.teamId:(teams[0]||{}).id||''});
  const [busy,setBusy]=useState(false);
  const wrap={position:'fixed',inset:0,background:'rgba(0,0,0,.5)',zIndex:200,display:'flex',alignItems:'flex-end',justifyContent:'center'};
  const sheet={width:'100%',maxWidth:480,background:'var(--card)',color:'var(--ink)',borderTopLeftRadius:22,borderTopRightRadius:22,padding:'20px 20px calc(env(safe-area-inset-bottom,0px) + 20px)',maxHeight:'88vh',overflowY:'auto'};
  const inp={width:'100%',height:46,border:'1.5px solid var(--line)',borderRadius:11,padding:'0 12px',background:'var(--field)',color:'var(--ink)',marginBottom:10};

  if(m.type==='assign'){ const u=m.user;
    return <div style={wrap} onClick={onClose}><div style={sheet} onClick={e=>e.stopPropagation()}>
      <div style={{fontWeight:900,fontSize:17,marginBottom:12}}>{u.name} 팀 이동</div>
      {teams.map(t=><button key={t.id} onClick={()=>{assignUser(u.id,t.id);onClose();}} className="row" style={{width:'100%',padding:'12px',borderRadius:11,background:u.teamId===t.id?'var(--soft)':'transparent',border:'1.5px solid var(--line)',marginBottom:8,color:'var(--ink)'}}>
        <span style={{flex:1,textAlign:'left',fontWeight:700,fontSize:14}}>{t.name}</span>{u.teamId===t.id&&<span style={{color:'var(--blue)',fontSize:12}}>현재</span>}</button>)}
      {teams.length===0&&<div className="muted">팀이 없습니다. 먼저 팀을 추가하세요.</div>}
      <button className="btn ghost" onClick={onClose}>닫기</button>
    </div></div>;
  }
  const roles = me.role==='branch'?['team','agent']:['agent'];
  const submit=async()=>{ if(!f.name||f.phone.length<10||f.pw.length<6){alert('이름·전화번호·비번(6자↑) 확인');return;}
    setBusy(true); const ok=await createAccount({name:f.name,phone:f.phone,pw:f.pw,role:f.role,teamId:f.teamId||null}); setBusy(false); if(ok) onClose(); };
  return <div style={wrap} onClick={onClose}><div style={sheet} onClick={e=>e.stopPropagation()}>
    <div style={{fontWeight:900,fontSize:17,marginBottom:4}}>계정 생성</div>
    <div className="muted" style={{fontSize:12,marginBottom:14}}>전화번호가 아이디입니다. 비번을 발급해 전달하세요.</div>
    {roles.length>1 && <><div style={{fontSize:11.5,fontWeight:700,color:'var(--sub)',marginBottom:6}}>역할</div>
      <div className="row" style={{gap:6,marginBottom:12}}>{roles.map(r=><button key={r} onClick={()=>setF({...f,role:r})} className="chip" style={{background:f.role===r?'var(--navy)':'var(--soft)',color:f.role===r?'#fff':'var(--sub)',padding:'8px 12px'}}>{ROLE[r].label}</button>)}</div></>}
    <input style={inp} value={f.name} onChange={e=>setF({...f,name:e.target.value})} placeholder="이름"/>
    <input style={inp} value={f.phone} onChange={e=>setF({...f,phone:e.target.value.replace(/\D/g,'')})} placeholder="전화번호(아이디)" inputMode="numeric"/>
    <input style={inp} value={f.pw} onChange={e=>setF({...f,pw:e.target.value})} placeholder="비밀번호(6자↑)"/>
    {me.role==='branch' && <><div style={{fontSize:11.5,fontWeight:700,color:'var(--sub)',marginBottom:6}}>소속 팀</div>
      <select style={inp} value={f.teamId} onChange={e=>setF({...f,teamId:e.target.value})}><option value="">— 선택 —</option>{teams.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select></>}
    <button className="btn blue" disabled={busy} onClick={submit}>{busy?'발급 중…':'계정 생성'}</button>
    <div style={{height:8}}/><button className="btn ghost" onClick={onClose}>취소</button>
  </div></div>;
}

  const users=db.users.filter(u=>!q||u.name.includes(q)||(u.phone||'').includes(q)||ROLE[u.role].label.includes(q));

                  <span style={{fontSize:12,color:'var(--sub)'}}>· {m.name}</span>
                  <button onClick={()=>setOrgModal({type:'assign',user:m})} style={{fontSize:11,color:'var(--blue)',fontWeight:700}}>팀 이동</button></div>)}
              </div>;})}
              {teams.length===0&&<div style={{fontSize:12,color:'var(--sub)',margin:'6px 0'}}>팀 없음</div>}
              <div className="row" style={{gap:8,marginTop:10}}>
                <button className="chip tag-team" onClick={()=>{const n=window.prompt('새 팀 이름');if(n)addTeam(b.id,n);}}>＋팀 추가</button>
                <button onClick={()=>delBranch(b.id)} style={{color:'#E23B4E',fontSize:11.5,fontWeight:700}}>🗑️ 지점 삭제</button></div>
            </div>}
          </div>;})}
      </>}

      {/* 계정 (전체 CRUD) */}
      {sec==='acct' && <>
        <div style={{fontWeight:900,marginBottom:10}}>계정 관리 <span style={{color:'var(--blue)'}}>{db.users.length}</span></div>

        {users.map(u=>{const b=db.branches.find(x=>x.id===u.branchId);const t=db.teams.find(x=>x.id===u.teamId);const open=editUser&&editUser.id===u.id;
