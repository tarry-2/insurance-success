        </div>}
        {dataCat && (()=>{const c=COLLS.find(x=>x.k===dataCat);const rows=db[dataCat]||[];return <>
          <button onClick={()=>setDataCat(null)} className="chip" style={{background:'var(--soft)',color:'var(--sub)',marginBottom:10}}>‹ 뒤로</button>
          <div style={{fontWeight:800,marginBottom:8}}>{c.icon} {c.label} ({rows.length})</div>
          {rows.length?rows.map(x=><div key={x.id} style={{...card,borderRadius:12,padding:'11px 14px',marginBottom:7}} className="row">
            <div style={{flex:1,minWidth:0}}><div style={{fontWeight:700,fontSize:13.5,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{c.name(x)}</div>
              <div style={{fontSize:11,color:'var(--sub)'}}>{c.sub(x)}</div></div>
            <button onClick={()=>delFrom(dataCat,x.id)} style={{color:'#E23B4E',fontSize:16}}>🗑️</button></div>):<div style={{color:'var(--sub)',padding:'10px 0'}}>데이터 없음</div>}
        </>;})()}
      </>}

      {/* 설정 (전 기능 컨트롤) */}
      {sec==='set' && <>
        <div style={{...card,borderRadius:14,padding:16}}>
          <b>🗂️ 자료 보관기간</b>
          <div style={{fontSize:11.5,color:'var(--sub)',margin:'4px 0 10px'}}>기본 무제한. 기간을 두면 지난 자료 자동 아카이브(법정 보관기간 준수).</div>
          <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
            {[[0,'무제한'],[12,'1년'],[24,'2년'],[36,'3년'],[60,'5년']].map(([v,l])=>
              <button key={v} onClick={()=>set({docRetentionMonths:v})} className="chip" style={{background:ret===v?'var(--navy)':'var(--soft)',color:ret===v?'#fff':'var(--sub)',padding:'8px 14px'}}>{l}</button>)}</div>
        </div>
        <div style={{...card,borderRadius:14,padding:16,marginTop:12}}>
          <b>💰 기본 수수료율</b>
          <div className="row" style={{gap:10,marginTop:10,alignItems:'center'}}>
            <input type="number" value={db.settings.commissionRate} onChange={e=>set({commissionRate:+e.target.value||0})}
              style={{width:90,height:46,border:'1.5px solid var(--line)',borderRadius:11,padding:'0 12px',textAlign:'center',fontWeight:800,background:'var(--card)',color:'var(--ink)'}}/>
            <span style={{fontWeight:800}}>%</span><span style={{fontSize:12,color:'var(--sub)'}}>APE 대비 환산</span></div>
        </div>
        <div style={{...card,borderRadius:14,padding:16,marginTop:12}}>
          <b>🏅 직급 규정</b>
          <div style={{marginTop:8}}>{GRADES.slice(1).map(g=><div key={g.key} className="row" style={{justifyContent:'space-between',padding:'7px 0',borderTop:'1px solid var(--line)'}}>
            <div style={{fontWeight:700,fontSize:13}}>{g.emoji} {g.name}</div>
            <div style={{fontSize:11,color:'var(--sub)'}}>APE {won(g.req.ape)} · 유지 {g.req.ret}%{g.req.rec?' · 정착 '+g.req.rec:''}</div></div>)}</div>
        </div>
        <div style={{...card,borderRadius:14,padding:16,marginTop:12}}>
          <b>🔑 코드</b>
          <div className="row" style={{justifyContent:'space-between',marginTop:8}}><span style={{fontSize:13}}>지점장 가입 승인 코드</span><b>{HQ_CODE}</b></div>
          <div className="row" style={{justifyContent:'space-between',marginTop:6}}><span style={{fontSize:13}}>개발자 접속 코드</span><b>{DEV_CODE}</b></div>
        </div>
        <div style={{height:14}}/>
        <button onClick={resetSeed} style={{width:'100%',height:46,borderRadius:12,background:'#E23B4E14',color:'#E23B4E',fontWeight:800}}>🔄 데모 데이터 초기화</button>
      </>}
    </div>

    {orgModal && <OrgModal db={db} me={me} m={orgModal} onClose={()=>setOrgModal(null)} createAccount={createAccount} assignUser={assignUser}/>}

    <div className="nav" style={{background:'var(--card)',borderTop:'1px solid var(--line)'}}>
      {[['dash','대시보드','📊'],['acct','계정','👤'],['data','데이터','🗄️'],['set','설정','⚙️']].map(([k,l,ic])=>
        <button key={k} className={sec===k?'on':''} onClick={()=>{setSec(k);setDataCat(null);setEditUser(null);}} style={{color:sec===k?'var(--blue)':'var(--sub)'}}><span className="ic">{ic}</span>{l}</button>)}
    </div>
  </div>;
}
// 계정 생성 / 팀 이동 모달
function OrgModal({db,me,m,onClose,createAccount,assignUser}){
  const [f,setF]=useState({name:'',phone:'',pw:'',role:'agent',branchId:(db.branches[0]||{}).id||'',teamId:''});
  const [busy,setBusy]=useState(false);
  const teamsOf=(bid)=>db.teams.filter(t=>t.branchId===bid);
  const wrap={position:'fixed',inset:0,background:'rgba(0,0,0,.5)',zIndex:200,display:'flex',alignItems:'flex-end',justifyContent:'center'};
  const sheet={width:'100%',maxWidth:480,background:'var(--card)',color:'var(--ink)',borderTopLeftRadius:22,borderTopRightRadius:22,padding:'20px 20px calc(env(safe-area-inset-bottom,0px) + 20px)',maxHeight:'88vh',overflowY:'auto'};
  const inp={width:'100%',height:46,border:'1.5px solid var(--line)',borderRadius:11,padding:'0 12px',background:'var(--field)',color:'var(--ink)',marginBottom:10};

  if(m.type==='assign'){ const u=m.user;
    return <div style={wrap} onClick={onClose}><div style={sheet} onClick={e=>e.stopPropagation()}>
      <div style={{fontWeight:900,fontSize:17,marginBottom:4}}>{u.name} 팀 이동</div>
      <div className="muted" style={{fontSize:12,marginBottom:14}}>이동할 팀을 선택하세요.</div>
      {db.branches.map(b=><div key={b.id} style={{marginBottom:10}}>
        <div style={{fontSize:12,fontWeight:800,color:'var(--sub)',marginBottom:6}}>{b.name}</div>
        {teamsOf(b.id).map(t=><button key={t.id} onClick={()=>{assignUser(u.id,t.id);onClose();}} className="row" style={{width:'100%',padding:'11px 12px',borderRadius:11,background:u.teamId===t.id?'var(--soft)':'transparent',border:'1.5px solid var(--line)',marginBottom:6,color:'var(--ink)'}}>
          <span style={{flex:1,textAlign:'left',fontWeight:700,fontSize:13.5}}>{t.name}</span>{u.teamId===t.id&&<span style={{color:'var(--blue)',fontSize:12}}>현재</span>}</button>)}
        {teamsOf(b.id).length===0&&<div className="muted" style={{fontSize:11}}>팀 없음</div>}
      </div>)}
      <button className="btn ghost" onClick={onClose}>닫기</button>
    </div></div>;
  }
  // account 생성
  const submit=async()=>{ if(!f.name||f.phone.length<10||f.pw.length<6){alert('이름·전화번호·비번(6자↑) 확인');return;}
    setBusy(true); const ok=await createAccount({name:f.name,phone:f.phone,pw:f.pw,role:f.role,branchId:f.branchId||null,teamId:f.role==='branch'?null:(f.teamId||null)}); setBusy(false); if(ok) onClose(); };
  return <div style={wrap} onClick={onClose}><div style={sheet} onClick={e=>e.stopPropagation()}>
    <div style={{fontWeight:900,fontSize:17,marginBottom:4}}>계정 생성</div>
    <div className="muted" style={{fontSize:12,marginBottom:14}}>전화번호가 아이디가 됩니다. 비번을 발급해 전달하세요.</div>
    <div style={{fontSize:11.5,fontWeight:700,color:'var(--sub)',marginBottom:6}}>역할</div>
    <div className="row" style={{gap:6,marginBottom:12}}>{['branch','team','agent'].map(r=><button key={r} onClick={()=>setF({...f,role:r})} className="chip" style={{background:f.role===r?'var(--navy)':'var(--soft)',color:f.role===r?'#fff':'var(--sub)',padding:'8px 12px'}}>{ROLE[r].label}</button>)}</div>
    <input style={inp} value={f.name} onChange={e=>setF({...f,name:e.target.value})} placeholder="이름"/>
    <input style={inp} value={f.phone} onChange={e=>setF({...f,phone:e.target.value.replace(/\D/g,'')})} placeholder="전화번호(아이디)" inputMode="numeric"/>
    <input style={inp} value={f.pw} onChange={e=>setF({...f,pw:e.target.value})} placeholder="비밀번호(6자↑)"/>
    <div style={{fontSize:11.5,fontWeight:700,color:'var(--sub)',marginBottom:6}}>소속 지점</div>
    <select style={inp} value={f.branchId} onChange={e=>setF({...f,branchId:e.target.value,teamId:''})}>{db.branches.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}</select>
    {f.role!=='branch' && <><div style={{fontSize:11.5,fontWeight:700,color:'var(--sub)',marginBottom:6}}>소속 팀</div>
      <select style={inp} value={f.teamId} onChange={e=>setF({...f,teamId:e.target.value})}><option value="">— 선택 —</option>{teamsOf(f.branchId).map(t=><option key={t.id} value={t.id}>{t.name}</option>)}</select></>}
    <button className="btn blue" disabled={busy} onClick={submit}>{busy?'발급 중…':'계정 생성'}</button>
    <div style={{height:8}}/>
    <button className="btn ghost" onClick={onClose}>취소</button>
  </div></div>;
}
function DevInput({label,val,on}){ return <div><div style={{fontSize:11.5,fontWeight:700,color:'var(--sub)',marginBottom:5}}>{label}</div>
  <input value={val} onChange={e=>on(e.target.value)} style={{width:'100%',height:44,border:'1.5px solid var(--line)',borderRadius:11,padding:'0 12px',background:'var(--card)',color:'var(--ink)'}}/></div>; }
function DevSelect({label,val,on,opts}){ return <div><div style={{fontSize:11.5,fontWeight:700,color:'var(--sub)',marginBottom:5}}>{label}</div>
  <select value={val} onChange={e=>on(e.target.value)} style={{width:'100%',height:44,border:'1.5px solid var(--line)',borderRadius:11,padding:'0 12px',background:'var(--card)',color:'var(--ink)'}}>
    {opts.map(([v,l])=><option key={v} value={v}>{l}</option>)}</select></div>; }

/* ───────── 자료 보관함 (기간별 저장·검색 + 카카오톡 전송) ───────── */
function Documents({db,me,scopeUsers,commit,flash}){
  const [q,setQ]=useState(''); const [period,setPeriod]=useState('전체'); const fileRef=React.useRef();
  const custName=(id)=>(db.customers.find(c=>c.id===id)||{}).name||'';
  const retention=(db.settings&&db.settings.docRetentionMonths)||0;
  const docs=db.docs.filter(d=>scopeUsers.some(u=>u.id===d.ownerId));
  const inPeriod=(d)=>{ if(period==='전체')return true; const mk=d.date.slice(0,7);
    if(period==='이번달')return mk===monthKey(0); if(period==='지난달')return mk===monthKey(1);
    if(period==='올해')return d.date.slice(0,4)===String(new Date().getFullYear()); return true; };
  const list=docs.filter(d=>inPeriod(d)&&(!q||custName(d.customerId).includes(q)||d.name.includes(q)||d.type.includes(q)))
    .sort((a,b)=>b.date.localeCompare(a.date));

  const onFile=(e)=>{ const f=e.target.files[0]; if(!f)return;
    const add=(dataUrl)=> commit({...db,docs:[...db.docs,{id:uuid(),customerId:'',ownerId:me.id,
      type:'기타',name:f.name,date:new Date().toISOString().slice(0,10),size:f.size,dataUrl:dataUrl||''}]});
    if(f.size>800*1024){ add(''); flash('메타데이터만 저장(용량 큰 파일은 백엔드 연결 후 실보관)'); }
    else { const r=new FileReader(); r.onload=()=>{add(r.result);flash('자료 저장됨 ✓');}; r.readAsDataURL(f); }
    e.target.value=''; };
  const saveFile=(d)=>{ if(d.dataUrl){const a=document.createElement('a');a.href=d.dataUrl;a.download=d.name;a.click();} else flash('데모 자료(원본 파일은 백엔드 연결 후)'); };
  const kakao=async(d)=>{ const text=`[인슈런스 석세스] ${custName(d.customerId)||''} ${d.type} · ${d.date}\n${d.name}`;
    try{ if(d.dataUrl&&navigator.canShare){ const blob=await(await fetch(d.dataUrl)).blob(); const file=new File([blob],d.name,{type:blob.type});
        if(navigator.canShare({files:[file]})){ await navigator.share({files:[file],text,title:d.name}); return; } }
      if(navigator.share){ await navigator.share({title:d.name,text}); return; } }catch(e){ if(e.name==='AbortError')return; }
    try{ await navigator.clipboard.writeText(text); flash('내용 복사됨 · 카카오톡은 모바일에서 공유돼요'); }catch(_){ flash('카카오톡 공유는 모바일에서 지원돼요'); } };
  const icon=(t)=> t.includes('영수증')?'🧾':t.includes('진단')?'📄':t.includes('확인서')?'📑':t.includes('증권')?'📋':t.includes('분석')?'📊':'📁';

  return <div style={{marginTop:16}}>
    <div className="row" style={{justifyContent:'space-between'}}>
      <div style={{fontWeight:900,fontSize:17}}>🗂️ 자료 보관함</div>
      <span className="chip" style={{background:retention?'#FFF3E0':'#E9FBF1',color:retention?'#C97A00':'#12A150',fontSize:10.5}}>보관 {retention?retention+'개월':'무제한'}</span></div>
    <div className="muted" style={{fontSize:11.5,margin:'4px 0 12px'}}>진단서·영수증 등 자료를 기간별로 보관하고 카카오톡으로 전송하세요.</div>

    <div style={{display:'flex',gap:7,overflowX:'auto',paddingBottom:8}}>
      {['전체','이번달','지난달','올해'].map(p=><button key={p} className="chip" onClick={()=>setPeriod(p)}
        style={{whiteSpace:'nowrap',background:period===p?'var(--navy)':'#EDF1F8',color:period===p?'#fff':'var(--sub)'}}>{p}</button>)}
    </div>
    <div className="field"><input value={q} onChange={e=>setQ(e.target.value)} placeholder="고객·서류명·종류 검색"/></div>
    <input ref={fileRef} type="file" accept="image/*,application/pdf" style={{display:'none'}} onChange={onFile}/>
    <button className="btn" style={{height:46,marginBottom:12}} onClick={()=>fileRef.current&&fileRef.current.click()}>＋ 자료 첨부·저장</button>

    <div className="card" style={{padding:'2px 14px'}}>
      {list.length?list.map(d=><div key={d.id} className="listrow">
        <div style={{width:38,height:38,borderRadius:11,background:'var(--soft)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,flex:'none'}}>{icon(d.type)}</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:700,fontSize:13.5,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{d.name}</div>
          <div className="muted" style={{fontSize:11}}>{custName(d.customerId)?custName(d.customerId)+' · ':''}<span className="chip tag-team" style={{padding:'1px 6px',fontSize:9.5}}>{d.type}</span> {d.date}</div></div>
        <button onClick={()=>saveFile(d)} title="저장" style={{fontSize:17,padding:'4px'}}>⬇️</button>
        <button onClick={()=>kakao(d)} title="카카오톡 전송" style={{fontSize:17,padding:'4px'}}>💬</button>
      </div>):<div className="muted" style={{padding:'14px 0'}}>해당 기간에 자료가 없습니다.</div>}
    </div>
    <div className="muted" style={{textAlign:'center',fontSize:11,marginTop:10}}>ⓘ 무제한 보관 · 실파일 저장/카톡 실전송은 백엔드(Storage·Kakao SDK) 연결 후 · 보관기간은 관리자에서 설정</div>
  </div>;
}

/* ───────── 병원 · 실손청구 관리 ───────── */
function Claims({db,me,scopeUsers,commit,flash}){
  const claims=db.claims.filter(cl=>scopeUsers.some(u=>u.id===cl.ownerId));
  const custName=(id)=>(db.customers.find(c=>c.id===id)||{}).name||'-';
  const reqDocs=(amt)=> amt>=50?['진단서','진료비내역','영수증']:['입퇴원확인서','진료비내역','영수증'];
  const docLabel={진단서:'진단서',입퇴원확인서:'입퇴원확인서',진료비내역:'진료비 세부내역서',영수증:'진료비 영수증'};
  const toggleDoc=(cl,d)=> commit({...db,claims:db.claims.map(x=>x.id===cl.id?{...x,docs:{...x.docs,[d]:!x.docs[d]}}:x)});
  const advance=(cl)=>{ const i=CLAIM_STATUS.indexOf(cl.status); if(i>=CLAIM_STATUS.length-1)return;
    commit({...db,claims:db.claims.map(x=>x.id===cl.id?{...x,status:CLAIM_STATUS[i+1]}:x)}); flash(custName(cl.customerId)+' → '+CLAIM_STATUS[i+1]); };

  return <div style={{marginTop:16}}>
    <div style={{fontWeight:900,fontSize:17}}>🏥 병원 · 실손청구</div>
    <div className="muted" style={{fontSize:12,margin:'4px 0 12px'}}>입원·수술 고객의 청구를 도와 유지율·신뢰·소개를 높입니다.</div>
    {claims.length===0 && <div className="card"><div className="muted">진행 중인 청구 건이 없습니다.</div></div>}
    {claims.map(cl=>{
      const req=reqDocs(cl.amount); const missing=req.filter(d=>!cl.docs[d]);
      const dd=ddayAbs(cl.dischargeDate); const si=CLAIM_STATUS.indexOf(cl.status);
      return <div key={cl.id} className="card" style={{marginBottom:12}}>
        <div className="row" style={{justifyContent:'space-between'}}>
          <div><b>{custName(cl.customerId)}</b> <span className="chip tag-agent" style={{fontSize:10}}>{cl.type}</span></div>
          <span className="chip" style={{background:si===3?'#12A1501A':'#1F5BFF1A',color:si===3?'#12A150':'#1F5BFF',fontSize:10.5}}>{cl.status}</span></div>
        <div className="muted" style={{fontSize:11.5,marginTop:4}}>{cl.hospital} · 입원 {cl.admitDate} · 퇴원 {cl.dischargeDate}{dd!==null&&dd>=0&&si<3?` (D-${dd})`:''} · 청구 {won(cl.amount)}</div>

        <div className="row" style={{gap:4,margin:'12px 0'}}>
          {CLAIM_STATUS.map((s,i)=><div key={s} style={{flex:1,textAlign:'center'}}>
            <div style={{height:5,borderRadius:3,background:i<=si?'#1F5BFF':'#E4EAF3'}}/>
            <div style={{fontSize:9.5,marginTop:3,color:i<=si?'var(--blue)':'var(--sub)',fontWeight:i===si?800:600}}>{s}</div></div>)}
        </div>

        <div style={{background:'var(--soft)',borderRadius:12,padding:12}}>
          <div style={{fontWeight:800,fontSize:12.5,marginBottom:6}}>📋 필요서류 {cl.amount>=50?'(50만원↑ · 진단서 필수)':'(50만원↓ · 입퇴원확인서로 대체 가능)'}</div>
          {req.map(d=><div key={d} className="row" onClick={()=>toggleDoc(cl,d)} style={{padding:'5px 0'}}>
            <div style={{width:20,height:20,borderRadius:6,border:'2px solid '+(cl.docs[d]?'#12A150':'#CBD5E8'),background:cl.docs[d]?'#12A150':'#fff',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,flex:'none'}}>{cl.docs[d]?'✓':''}</div>
            <div style={{fontSize:13,marginLeft:8,color:cl.docs[d]?'var(--ink)':'var(--sub)'}}>{docLabel[d]}</div></div>)}
          {missing.length>0 && <div style={{fontSize:11,color:'#C97A00',marginTop:6,fontWeight:700}}>미비 {missing.length}건 — 고객에게 안내하세요</div>}
        </div>
        {cl.status!=='지급완료' && <button className="btn" style={{height:44,marginTop:10}} disabled={si===0&&missing.length>0} onClick={()=>advance(cl)}>{si===0?(missing.length>0?'서류 미비':'접수하기'):'다음 단계 →'}</button>}
      </div>;
    })}
    <div className="muted" style={{textAlign:'center',fontSize:11,marginTop:8}}>ⓘ 서류안내·상태는 데모 · 실제 청구접수 연동은 백엔드 후</div>
  </div>;
}

/* ───────── 승급/직급 관리 ───────── */
function Promotion({db,me,scopeUsers}){
  const m=userMetrics(db,me);
  const ci=gradeIdx(me.grade); const cur=GRADES[ci]; const next=GRADES[ci+1];
  const mkRow=(label,val,req,unit,ape)=>({label,val,req,unit,ape,pct:req?Math.min(100,Math.round(val/req*100)):100,ok:val>=req});
  let rows=[],ready=false,apeShort=0;
  if(next){
    rows=[mkRow('환산성적 APE',m.ape,next.req.ape,'만',true), mkRow('유지율',m.ret,next.req.ret,'%'),
      ...(next.req.rec>0?[mkRow('정착 리쿠르팅',m.rec,next.req.rec,'명')]:[])];
    ready=rows.every(r=>r.ok); apeShort=Math.max(0,next.req.ape-m.ape);
  }
  const isMgr=me.role!=='agent'; const teamAgents=scopeUsers.filter(u=>u.role==='agent');
  return <div style={{marginTop:16}}>
    <div className="codebox" style={{background:'linear-gradient(135deg,#0B1B3F,#1F5BFF)'}}>
      <div style={{fontSize:12,opacity:.8}}>현재 직급</div>
      <div style={{fontSize:23,fontWeight:900,marginTop:2}}>{cur.emoji} {cur.name}</div></div>
    {next ? <div className="card" style={{marginTop:14}}>
      <div className="row" style={{justifyContent:'space-between'}}>
        <b>다음 등급 · {next.emoji} {next.name}</b>{ready&&<span className="chip tag-team">승급 가능! 🎉</span>}</div>
      <div style={{marginTop:12}}>
        {rows.map((r,i)=><div key={i} style={{marginBottom:12}}>
          <div className="row" style={{justifyContent:'space-between',marginBottom:4}}>
            <span style={{fontSize:13,fontWeight:700}}>{r.label}</span>
            <span style={{fontSize:12,fontWeight:800,color:r.ok?'#12A150':'#C97A00'}}>{r.ape?won(r.val):r.val+r.unit} / {r.ape?won(r.req):r.req+r.unit} {r.ok?'✓':''}</span></div>
          <div style={{height:8,borderRadius:5,background:'var(--track)',overflow:'hidden'}}>
            <div style={{height:'100%',width:r.pct+'%',borderRadius:5,background:r.ok?'#12A150':'linear-gradient(90deg,#1F5BFF,#38A4FF)',transition:'width .6s'}}/></div></div>)}
      </div>
      <div className="card" style={{background:'var(--soft)',marginTop:6}}>
        <div style={{fontWeight:800,fontSize:13}}>🔮 승급 시뮬레이터</div>
        <div className="muted" style={{fontSize:12,marginTop:3}}>{ready?'모든 요건 충족 — 이번 달 승급 대상입니다! 🎉':apeShort>0?`이번 달 APE ${won(apeShort)} 더 달성하면 승급에 가까워집니다.`:'유지율·리쿠르팅 요건을 채우면 승급합니다.'}</div></div>
    </div> : <div className="card" style={{marginTop:14}}><div className="muted">최고 등급입니다 💎</div></div>}

    {isMgr && teamAgents.length>0 && <div className="card" style={{marginTop:14}}>
      <b>팀원 진급 현황</b>
      <div style={{marginTop:8}}>
        {teamAgents.map(u=>{const um=userMetrics(db,u);const uci=gradeIdx(u.grade);const un=GRADES[uci+1];
          let pct=100;const risk=um.ret<80;
          if(un){pct=Math.round(Math.min(Math.min(100,um.ape/(un.req.ape||1)*100),Math.min(100,um.ret/(un.req.ret||1)*100),un.req.rec?Math.min(100,um.rec/un.req.rec*100):100));}
          return <div key={u.id} className="listrow">
            <div className="ava">{u.name[0]}</div>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:13.5}}>{u.name} <span className="muted" style={{fontSize:11}}>{GRADES[uci].emoji}{GRADES[uci].name}</span></div>
              <div style={{height:6,borderRadius:3,background:'var(--track)',overflow:'hidden',marginTop:4}}>
                <div style={{height:'100%',width:pct+'%',background:pct>=100?'#12A150':'linear-gradient(90deg,#1F5BFF,#38A4FF)'}}/></div></div>
            {risk?<span className="chip" style={{background:'#E23B4E1A',color:'#E23B4E',fontSize:10}}>자격 위험</span>:pct>=100?<span className="chip tag-team" style={{fontSize:10}}>승급임박</span>:<span style={{fontSize:12,fontWeight:800,color:'var(--blue)'}}>{pct}%</span>}
          </div>;})}
      </div></div>}
    <div className="muted" style={{textAlign:'center',fontSize:11,marginTop:12}}>ⓘ 승급 요건은 데모 기준 · 실제 규정은 관리자 페이지에서 설정</div>
  </div>;
}

/* ───────── 매출/업적 (역할별 집계) ───────── */
function Performance({db,me,scopeUsers}){
  const agentsIn = scopeUsers.filter(u=>u.role==='agent');
  const sales = db.sales.filter(s=>scopeUsers.some(u=>u.id===s.agentId));
  const tm = monthKey(0);
  const cur = sales.filter(s=>s.month===tm);
  const ape = cur.reduce((a,s)=>a+s.ape,0);
  const cnt = cur.length;
  const goal = me.role==='agent' ? (me.goalApe||300) : (agentsIn.reduce((a,u)=>a+(u.goalApe||300),0)||300);
  const rate = Math.min(100,Math.round(ape/goal*100));
  const comm = {수령:0,미수:0,예상:0,환수:0}; cur.forEach(s=>comm[s.commStatus]=(comm[s.commStatus]||0)+s.commission);
  const trend = [5,4,3,2,1,0].map(o=>({mk:monthKey(o), ape:sales.filter(s=>s.month===monthKey(o)).reduce((a,s)=>a+s.ape,0)}));
  const tmax = Math.max(1,...trend.map(t=>t.ape));
  // 상품 믹스
  const mix={}; cur.forEach(s=>mix[s.product]=(mix[s.product]||0)+1);
  // 랭킹(관리자)
  const rank = agentsIn.map(u=>({u,ape:cur.filter(s=>s.agentId===u.id).reduce((a,s)=>a+s.ape,0),
    cnt:cur.filter(s=>s.agentId===u.id).length})).sort((a,b)=>b.ape-a.ape);
  const rmax=Math.max(1,...rank.map(r=>r.ape));
  const isMgr = me.role!=='agent';

  return <div style={{marginTop:16}}>
    <div style={{fontWeight:900,fontSize:17,marginBottom:12}}>📈 매출·업적 <span className="muted" style={{fontSize:12,fontWeight:600}}>({mLabel(tm)} 기준)</span></div>

    {/* 이번달 요약 */}
    <div className="row" style={{gap:10}}>
      <div className="stat"><div className="v">{cnt}건</div><div className="l">신계약</div></div>
      <div className="stat"><div className="v">{won(ape)}</div><div className="l">환산성적(APE)</div></div>
      <div className="stat"><div className="v">{isMgr?agentsIn.length:won(cur.reduce((a,s)=>a+Math.round(s.ape/12),0))}</div><div className="l">{isMgr?'설계사':'월납합'}</div></div>
    </div>

    {/* 목표 달성률 */}
    <div className="card" style={{marginTop:14}}>
      <div className="row" style={{justifyContent:'space-between'}}><b>목표 달성률</b><span style={{fontWeight:900,color:'var(--blue)'}}>{rate}%</span></div>
      <div style={{height:10,borderRadius:6,background:'var(--track)',overflow:'hidden',margin:'10px 0 6px'}}>
        <div style={{height:'100%',width:rate+'%',borderRadius:6,background:'linear-gradient(90deg,#1F5BFF,#38A4FF)',transition:'width .6s'}}/></div>
      <div className="muted" style={{fontSize:12}}>{won(ape)} / 목표 {won(goal)} · {ape>=goal?'목표 달성! 🎉':'목표까지 '+won(goal-ape)}</div>
    </div>

    {/* 수수료 */}
    <div className="card" style={{marginTop:12}}>
      <b>수수료 현황</b>
      <div className="row" style={{gap:8,marginTop:10}}>
        {[['수령','#12A150'],['미수','#C97A00'],['예상','#1F5BFF'],['환수','#E23B4E']].map(([k,col])=>(
          <div key={k} style={{flex:1,textAlign:'center',background:col+'12',borderRadius:12,padding:'10px 4px'}}>
            <div style={{fontWeight:900,color:col,fontSize:15}}>{won(comm[k]||0)}</div><div className="muted" style={{fontSize:10.5}}>{k}</div></div>))}
      </div>
    </div>

    {/* 월별 추이 */}
    <div className="card" style={{marginTop:12}}>
      <b>월별 추이 (APE)</b>
      <div className="row" style={{alignItems:'flex-end',gap:8,height:110,marginTop:14}}>
        {trend.map((t,i)=><div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:5}}>
          <div style={{fontSize:10,fontWeight:800,color:'var(--sub)'}}>{t.ape?won(t.ape):''}</div>
          <div style={{width:'70%',height:Math.round(t.ape/tmax*80)+4,borderRadius:6,
            background:i===trend.length-1?'linear-gradient(180deg,#1F5BFF,#38A4FF)':'#D7E0F5',transition:'height .5s'}}/>
          <div style={{fontSize:10,color:'var(--sub)'}}>{mLabel(t.mk)}</div></div>)}
      </div>
    </div>

    {/* 상품 믹스 */}
    {Object.keys(mix).length>0 && <div className="card" style={{marginTop:12}}>
      <b>상품 믹스 ({mLabel(tm)})</b>
      <div style={{display:'flex',flexWrap:'wrap',gap:8,marginTop:10}}>
        {Object.entries(mix).map(([p,n])=><span key={p} className="chip tag-branch">{p} {n}</span>)}</div>
    </div>}

    {/* 랭킹 (관리자) */}
    {isMgr && <div className="card" style={{marginTop:12}}>
      <b>{me.role==='branch'?'지점':'팀'} 설계사 랭킹 ({mLabel(tm)})</b>
      <div style={{marginTop:10}}>
        {rank.map((r,i)=><div key={r.u.id} style={{marginBottom:10}}>
          <div className="row" style={{justifyContent:'space-between',marginBottom:4}}>
            <div style={{fontWeight:700,fontSize:13.5}}>{['🥇','🥈','🥉'][i]||(i+1+'.')} {r.u.name}</div>
            <div style={{fontSize:12,fontWeight:800}}>{won(r.ape)} · {r.cnt}건</div></div>
          <div style={{height:7,borderRadius:4,background:'var(--track)',overflow:'hidden'}}>
            <div style={{height:'100%',width:(r.ape/rmax*100)+'%',borderRadius:4,background:'linear-gradient(90deg,#1F5BFF,#38A4FF)'}}/></div>
        </div>)}
        {rank.length===0 && <div className="muted">설계사 실적이 없습니다.</div>}
      </div>
    </div>}
    <div className="muted" style={{textAlign:'center',fontSize:11,marginTop:12}}>ⓘ 지금은 데모 데이터 · 계약 등록/수수료는 백엔드 연결 후 실집계</div>
  </div>;
}

/* ───────── 커뮤니티 / 자료실 (전 인원 열람 + 글쓰기 실동작) ───────── */
function Community({db,me,commit,flash}){
  const [cat,setCat]=useState('전체'); const [open,setOpen]=useState(null); const [write,setWrite]=useState(false);
  const [f,setF]=useState({cat:'세일즈 스크립트',title:'',body:''});
  const posts=[...(db.posts||[])].sort((a,b)=>b.date.localeCompare(a.date));
  const list=posts.filter(p=>cat==='전체'||p.cat===cat);
  const canNotice = me.role==='hq'||me.role==='branch'||me.role==='team';
  const submit=()=>{ if(!f.title.trim())return flash('제목을 입력하세요');
    commit({...db,posts:[...db.posts,{id:uuid(),cat:f.cat,title:f.title.trim(),by:me.name,authorId:me.id,date:new Date().toISOString().slice(0,10),body:f.body.trim()}]});
    setF({cat:'세일즈 스크립트',title:'',body:''}); setWrite(false); flash('게시글 등록 ✓'); };

  if(write) return <div style={{marginTop:16}}>
    <div className="row" style={{justifyContent:'space-between',marginBottom:14}}>
      <div style={{fontWeight:900,fontSize:17}}>✍️ 글쓰기</div>
      <button className="chip" style={{background:'var(--seg)',color:'var(--sub)'}} onClick={()=>setWrite(false)}>취소</button></div>
    <div className="field"><label>카테고리</label>
      <select value={f.cat} onChange={e=>setF({...f,cat:e.target.value})}>
        {POST_CATS.filter(c=>c!=='공지'||canNotice).map(c=><option key={c}>{c}</option>)}</select></div>
    <div className="field"><label>제목</label><input value={f.title} onChange={e=>setF({...f,title:e.target.value})} placeholder="제목을 입력하세요"/></div>
    <div className="field"><label>내용</label>
      <textarea value={f.body} onChange={e=>setF({...f,body:e.target.value})} placeholder="내용을 입력하세요" rows={7}
        style={{width:'100%',border:'1.5px solid var(--line)',borderRadius:12,padding:12,fontFamily:'inherit',fontSize:15,resize:'vertical'}}/></div>
    <button className="btn blue" onClick={submit}>등록</button>
  </div>;

  if(open){ const p=posts.find(x=>x.id===open); if(p) return <div style={{marginTop:16}}>
    <div className="top" style={{padding:0,marginBottom:12}}><button className="back" onClick={()=>setOpen(null)}>‹</button>
      <span className="chip tag-team">{p.cat}</span></div>
    <div style={{fontWeight:900,fontSize:20,lineHeight:1.35}}>{p.hot&&'🔥 '}{p.title}</div>
    <div className="muted" style={{fontSize:12,margin:'8px 0 16px'}}>{p.by} · {p.date}</div>
    <div className="legal" style={{fontSize:14.5,color:'var(--ink)'}}>{p.body||'(내용 없음)'}</div>
  </div>; }

  return <div style={{marginTop:16}}>
    <div className="row" style={{justifyContent:'space-between',marginBottom:10}}>
      <div style={{fontWeight:900,fontSize:17}}>📚 커뮤니티 · 자료실</div>
      <button className="chip tag-branch" onClick={()=>setWrite(true)}>＋ 글쓰기</button></div>
    <div style={{display:'flex',gap:7,overflowX:'auto',paddingBottom:8}}>
      {['전체',...POST_CATS].map(x=><button key={x} className="chip" onClick={()=>setCat(x)}
        style={{whiteSpace:'nowrap',background:cat===x?'var(--navy)':'#EDF1F8',color:cat===x?'#fff':'var(--sub)'}}>{x}</button>)}
    </div>
    <div className="card" style={{padding:'2px 16px'}}>
      {list.length?list.map(p=><div key={p.id} className="listrow" onClick={()=>setOpen(p.id)}>
        <div style={{flex:1}}>
          <div style={{fontWeight:700,fontSize:14}}>{p.hot&&<span style={{color:'#E23B4E'}}>🔥 </span>}{p.title}</div>
          <div className="muted" style={{fontSize:11.5}}><span className="chip tag-team" style={{padding:'1px 7px',fontSize:10}}>{p.cat}</span>  {p.by} · {p.date}</div>
        </div><div style={{color:'var(--blue)',fontWeight:800}}>›</div>
      </div>):<div className="muted" style={{padding:'14px 0'}}>글이 없습니다. 첫 글을 남겨보세요.</div>}
    </div>
    <div className="muted" style={{textAlign:'center',fontSize:11,marginTop:12}}>ⓘ 전 인원 열람 · 파일 업로드는 백엔드 연결 후</div>
  </div>;
}

function Person({u,team}){
  return <div className="listrow">
    <div className="ava">{u.name[0]}</div>
    <div style={{flex:1}}><div style={{fontWeight:700,fontSize:14}}>{u.name}{team?<span className="muted" style={{fontSize:11}}>  · {team.name}</span>:''}</div>
      <div className="muted" style={{fontSize:11.5}}>유지율 90% · 이번달 3건 · 활동 정상</div></div>
    <div style={{fontSize:12,color:'var(--blue)',fontWeight:800}}>›</div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
