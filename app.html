<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>인슈런스 석세스 프로그램</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#1F5BFF">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--navy:#0B1B3F;--blue:#1F5BFF;--blue2:#38A4FF;--ink:#0B1B3F;--sub:#5B6781;--line:#E4EAF3;--bg:#F4F7FC;--card:#fff}
  html,body{height:100%}
  body{font-family:'Pretendard Variable',Pretendard,system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg);
    -webkit-font-smoothing:antialiased}
  #root{min-height:100dvh}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font-family:inherit;font-size:15px}
  .app{max-width:480px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;overflow:hidden}
  .scroll{min-height:100dvh;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
  .pad{padding:20px}
  .btn{width:100%;height:52px;border-radius:14px;background:var(--navy);color:#fff;font-size:16px;font-weight:700;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .14s,filter .2s}
  .btn:active{transform:scale(.97)} .btn:disabled{opacity:.4}
  .btn.blue{background:linear-gradient(135deg,var(--blue),var(--blue2))}
  .btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin-bottom:7px}
  .field input,.field select{width:100%;height:50px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;
    outline:none;transition:border-color .15s}
  .field input:focus,.field select:focus{border-color:var(--blue)}
  .err{color:#E23B4E;font-size:12px;margin-top:6px}
  .ok{color:#12A150;font-size:12px;margin-top:6px;font-weight:700}
  .card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 2px 12px rgba(20,40,90,.05)}
  .row{display:flex;align-items:center;gap:10px}
  .chip{font-size:11px;font-weight:800;padding:4px 10px;border-radius:20px}
  .tag-branch{background:#EAF0FF;color:#1F5BFF}.tag-team{background:#E9FBF1;color:#12A150}.tag-agent{background:#FFF3E0;color:#C97A00}
  .rolecard{flex:1;border:2px solid var(--line);border-radius:16px;padding:16px 12px;text-align:center;background:#fff;
    transition:.15s;cursor:pointer}
  .rolecard.on{border-color:var(--blue);background:#F5F8FF;box-shadow:0 6px 20px rgba(31,91,255,.14)}
  .rolecard .ic{font-size:26px}.rolecard .t{font-weight:800;margin-top:6px;font-size:14px}.rolecard .d{font-size:10.5px;color:var(--sub);margin-top:3px}
  .check{display:flex;align-items:flex-start;gap:10px;padding:11px 0;font-size:13.5px}
  .check .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;
    font-size:13px;color:#fff;transition:.15s}
  .check .box.on{background:var(--blue);border-color:var(--blue)}
  .link{color:var(--blue);font-weight:700;text-decoration:underline;font-size:12.5px}
  .top{display:flex;align-items:center;gap:12px;padding:16px 20px}
  .back{width:38px;height:38px;border-radius:11px;background:#fff;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:18px}
  .h1{font-size:24px;font-weight:900;letter-spacing:-.5px;line-height:1.25}
  .muted{color:var(--sub);font-size:13.5px;line-height:1.6}
  .legal{font-size:12.5px;line-height:1.85;color:#3A4763;white-space:pre-wrap}
  .stat{flex:1;background:#fff;border-radius:14px;padding:14px;text-align:center}
  .stat .v{font-size:20px;font-weight:900}.stat .l{font-size:11px;color:var(--sub);margin-top:2px}
  .seg{display:flex;background:#EDF1F8;border-radius:12px;padding:4px;gap:4px}
  .seg button{flex:1;height:38px;border-radius:9px;font-size:13px;font-weight:800;color:var(--sub)}
  .seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.08)}
  .listrow{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line)}
  .ava{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex:none}
  .codebox{background:var(--navy);color:#fff;border-radius:14px;padding:16px;text-align:center}
  .codebox .c{font-size:26px;font-weight:900;letter-spacing:3px;margin-top:4px}
  .nav{position:sticky;bottom:0;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 0 calc(env(safe-area-inset-bottom,0px) + 6px)}
  .nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:#9AA6BE;font-weight:700;padding:6px 0}
  .nav button.on{color:var(--blue)}.nav .ic{font-size:19px}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0B1B3Fdd;color:#fff;padding:11px 18px;
    border-radius:12px;font-size:13px;font-weight:700;z-index:100;max-width:90%}
</style>
</head>
<body>

<script type="text/babel" data-presets="react">
const {useState,useEffect} = React;

/* ───────── 로컬 저장소 (백엔드는 나중에 Supabase로 교체) ───────── */
const DB = {

const rid = (p)=> p+'-'+Math.random().toString(36).slice(2,6).toUpperCase();

      contracts:[{product:'실손보험',monthly:5,status:'정상',unpaid:0,maturity:soon(12)}]},

      contracts:[{product:'실손보험',monthly:6,status:'정상',unpaid:0,maturity:''}]},
    {id:'c5',ownerId:'u4',name:'한지민',job:'프리랜서',income:380,birthday:soon(1),anniversary:'',childbirth:'',surgery:'',discharge:'',lastContact:'2026-07-30',memo:'',
      contracts:[{product:'건강보험',monthly:9,status:'정상',unpaid:0,maturity:''}]},

function seed(){
  const d = DB.load();
  if(d){ let ch=false; if(!d.customers){d.customers=demoCustomers();ch=true;} if(!d.sales){d.sales=demoSales();ch=true;}
    if(!d.recruits){d.recruits=demoRecruits();ch=true;}
    if(!d.claims){d.claims=demoClaims();ch=true;}
    (d.users||[]).forEach(u=>{ if(u.role!=='branch'&&u.goalApe==null){u.goalApe=300;ch=true;}
      if(!u.grade){u.grade=u.role==='branch'?'PLAT':u.role==='team'?'GOLD':'FC';ch=true;} });

  const branch = {id:'b1', name:'강남지점', code:'GN-1A2B', managerId:'u1'};

    {id:'u2', name:'이팀장', phone:'01022220000', pw:'1234', role:'team',   branchId:'b1', teamId:'t1', recruiterId:'u1', code:'TM-3C4D', goalApe:300, grade:'GOLD', consent:c(), createdAt:Date.now()},
    {id:'u3', name:'박설계', phone:'01033330000', pw:'1234', role:'agent',  branchId:'b1', teamId:'t1', recruiterId:'u2', code:null, goalApe:300, grade:'SFC', consent:c(), createdAt:Date.now()},
    {id:'u4', name:'최설계', phone:'01044440000', pw:'1234', role:'agent',  branchId:'b1', teamId:'t1', recruiterId:'u2', code:null, goalApe:200, grade:'FC', consent:c(), createdAt:Date.now()},
  ];
  const db = {branches:[branch], teams:[team], users, customers:demoCustomers(), sales:demoSales(), recruits:demoRecruits(), claims:demoClaims(), session:null};
  DB.save(db); return db;

function c(){ return {tos:true,privacy:true,marketing:false,at:Date.now()} }

/* ───────── D-day / 오늘의 할일 엔진 ───────── */
function ddayAnnual(mmdd){ // 'YYYY-MM-DD' → 올해 기준 남은 일수(생일·기념일 반복)
  if(!mmdd) return null; const t=new Date(); t.setHours(0,0,0,0);
  const p=mmdd.split('-'); let d=new Date(t.getFullYear(),+p[1]-1,+p[2]);
  if(d<t) d=new Date(t.getFullYear()+1,+p[1]-1,+p[2]);
  return Math.round((d-t)/864e5);
}
function ddayAbs(date){ // 절대일자까지 남은 일수(+미래 / -과거)
  if(!date) return null; const t=new Date(); t.setHours(0,0,0,0);
  const p=date.split('-'); const d=new Date(+p[0],+p[1]-1,+p[2]);
  return Math.round((d-t)/864e5);
}
function daysSince(date){ if(!date) return null; return -ddayAbs(date); }
const ddLabel=(n)=> n===0?'D-DAY':(n>0?'D-'+n:'D+'+(-n));

// 고객 리스트 → 할일 아이템(우선순위순)
function buildTodos(customers){
  const items=[];
  for(const c of customers){
    for(const ct of (c.contracts||[])){
      if(ct.status==='미납'||ct.unpaid>=1){
        const crit=ct.unpaid>=2;
        items.push({p:crit?0:1,type:'미납',icon:'⚠️',color:crit?'#E23B4E':'#C97A00',cust:c,
          text:`${ct.product} ${ct.unpaid}개월 미납${crit?' · 실효 위험!':''}`,dd:crit?0:1});
      }
      const m=ddayAbs(ct.maturity);
      if(m!==null && m>=0 && m<=30) items.push({p:2,type:'만기/갱신',icon:'🔁',color:'#1F5BFF',cust:c,text:`${ct.product} 만기·갱신`,dd:m});
    }
    const sg=daysSince(c.surgery), dc=ddayAbs(c.discharge);
    if(c.surgery && sg!==null && sg>=0 && sg<=14) items.push({p:1,type:'병원',icon:'🏥',color:'#7A5BFF',cust:c,text:`수술 후 케어 · 실손청구 안내`,dd:dc!==null?dc:0});
    else if(dc!==null && dc>=0 && dc<=7) items.push({p:1,type:'병원',icon:'🏥',color:'#7A5BFF',cust:c,text:`퇴원 예정 · 청구 서류 팔로업`,dd:dc});
    const bd=ddayAnnual(c.birthday); if(bd!==null && bd<=7) items.push({p:2,type:'생일',icon:'🎂',color:'#12A150',cust:c,text:`생일 축하 연락`,dd:bd});
    const an=ddayAnnual(c.anniversary); if(an!==null && an<=7) items.push({p:2,type:'결혼기념일',icon:'💍',color:'#12A150',cust:c,text:`결혼기념일 축하`,dd:an});
    const cb=ddayAbs(c.childbirth); if(c.childbirth && cb!==null && cb>=-14 && cb<=30) items.push({p:1,type:'출산',icon:'👶',color:'#E86AA6',cust:c,text:`출산 축하 · 어린이보험 제안`,dd:cb});
    const lc=daysSince(c.lastContact); if(lc!==null && lc>=45 && !c.surgery) items.push({p:3,type:'안부',icon:'📞',color:'#5B6781',cust:c,text:`${lc}일째 미접촉 · 안부 연락`,dd:0});
  }
  return items.sort((a,b)=> a.p-b.p || a.dd-b.dd);
}
const won=(n)=> n>=10000?(n/10000).toFixed(n%10000?1:0)+'억':n+'만';

/* ───────── 직급 체계 / 승급 요건 ───────── */
const GRADES=[
  {key:'FC',   name:'FC · 설계사',      emoji:'🌱', req:{ape:0,   ret:0,  rec:0}},
  {key:'SFC',  name:'시니어 FC',        emoji:'⭐', req:{ape:300, ret:80, rec:0}},
  {key:'BRONZE',name:'브론즈 매니저',   emoji:'🥉', req:{ape:500, ret:85, rec:1}},
  {key:'SILVER',name:'실버 매니저',     emoji:'🥈', req:{ape:800, ret:88, rec:3}},
  {key:'GOLD', name:'골드 매니저',      emoji:'🥇', req:{ape:1200,ret:90, rec:5}},
  {key:'PLAT', name:'플래티넘 매니저',  emoji:'💎', req:{ape:2000,ret:92, rec:10}},
];
const gradeIdx=(k)=>Math.max(0,GRADES.findIndex(g=>g.key===k));
function userMetrics(db,u){
  const ape=db.sales.filter(s=>s.agentId===u.id&&s.month===monthKey(0)).reduce((a,s)=>a+s.ape,0);
  const cts=db.customers.filter(c=>c.ownerId===u.id).flatMap(c=>c.contracts||[]);
  const ret=cts.length?Math.round(cts.filter(x=>x.status==='정상').length/cts.length*100):100;
  const rec=db.recruits.filter(r=>r.ownerId===u.id&&r.stage==='정착').length;
  return {ape,ret,rec};
}

/* ───────── 실적(sales) 데모 데이터 ───────── */
const monthKey=(o)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-o);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`};
const mLabel=(mk)=> (+mk.split('-')[1])+'월';
function demoSales(){
  const prods=['암보험','종신보험','실손보험','건강보험','어린이보험'];
  const apes=[120,80,150,60,90,110];
  const rows=[]; let id=1;
  const gen=(agent,perMonth)=>{ perMonth.forEach((n,idx)=>{ const o=5-idx;
    for(let i=0;i<n;i++){ const ape=apes[(i+idx)%apes.length];
      rows.push({id:'s'+(id++),agentId:agent,month:monthKey(o),product:prods[(i+idx)%prods.length],ape,
        commission:Math.round(ape*0.35),commStatus:o===0?(i%2?'미수':'예상'):'수령'}); } }); };
  gen('u3',[3,4,2,5,3,2]); gen('u4',[1,2,1,2,1,1]);
  return rows;
}

/* ───────── 리쿠르팅 후보(recruits) 데모 ───────── */
const REC_STAGES=['가망','면접','위촉','교육','정착'];

  return [

    {id:'r2',ownerId:'u2',branchId:'b1',teamId:'t1',name:'윤면접',phone:'01050000002',stage:'면접',source:'채용공고',addedAt:soon(-8)},

/* ───────── 실손청구(claims) 데모 ───────── */
const CLAIM_STATUS=['서류준비','접수','심사중','지급완료'];
function demoClaims(){
  return [
    {id:'cl1',customerId:'c4',ownerId:'u3',type:'수술',hospital:'서울정형외과',admitDate:soon(-4),dischargeDate:soon(1),amount:120,
      docs:{진단서:true,진료비내역:true,영수증:false},status:'서류준비'},
    {id:'cl2',customerId:'c1',ownerId:'u3',type:'통원',hospital:'강남내과',admitDate:soon(-10),dischargeDate:soon(-10),amount:35,
      docs:{입퇴원확인서:true,진료비내역:true,영수증:true},status:'접수'},
  ];
}

const ROLE = {
  branch:{label:'지점장', chip:'tag-branch', ic:'🏢', d:'팀·설계사 전체 관리'},
  team:  {label:'팀장',   chip:'tag-team',   ic:'👔', d:'팀원 관리 + 본인 실적'},
  agent: {label:'설계사', chip:'tag-agent',  ic:'🧑‍💼',d:'본인 고객·실적'},
};

/* ───────── 메인 앱 ───────── */
function App(){
  const [db,setDb] = useState(seed);
  const [route,setRoute] = useState(db.session ? 'home' : 'landing');
  const [toast,setToast] = useState('');
  const commit = (nd)=>{ DB.save(nd); setDb({...nd}); };
  const me = db.users.find(u=>u.id===db.session) || null;
  const flash = (m)=>{ setToast(m); setTimeout(()=>setToast(''),1800); };

  const go = (r)=>setRoute(r);
  const login = (uid)=>{ const nd={...db,session:uid}; commit(nd); go('home'); };
  const logout = ()=>{ const nd={...db,session:null}; commit(nd); go('landing'); };

  let view;
  if(route==='landing') view=<Landing go={go}/>;
  else if(route==='login') view=<Login db={db} go={go} login={login} flash={flash}/>;
  else if(route==='signup') view=<Signup db={db} commit={commit} go={go} login={login} flash={flash}/>;
  else if(route==='terms') view=<Legal kind="terms" go={go}/>;
  else if(route==='privacy') view=<Legal kind="privacy" go={go}/>;
  else if(route==='home' && me) view=<Home db={db} me={me} logout={logout} flash={flash} commit={commit}/>;
  else view=<Landing go={go}/>;

  return <div className="app">{view}{toast&&<div className="toast">{toast}</div>}</div>;
}

/* ───────── 시작 화면 ───────── */
function Landing({go}){
  return <div className="scroll" style={{background:'linear-gradient(180deg,#F7F9FD,#EAF0FA)'}}>
    <div className="pad" style={{paddingTop:56}}>
      <div className="muted" style={{fontWeight:700}}>사람의 가치를 더하는<br/>보험 전문가의 성장 플랫폼</div>
      <div className="h1" style={{fontSize:34,marginTop:16}}>인슈런스<br/><span style={{color:'var(--blue)'}}>석세스</span><br/>프로그램</div>
      <div style={{fontSize:11,letterSpacing:4,color:'#8A94AB',marginTop:10,fontWeight:700}}>INSURANCE SUCCESS</div>
      <div className="card" style={{marginTop:28}}>
        <div style={{fontWeight:800,marginBottom:4}}>유지율·정착률을 올리는 영업 시스템</div>
        <div className="muted">승급·리쿠르팅·매출·고객·병원·기념일 관리까지 — 매일의 "할 일"로 성과를 만듭니다.</div>
      </div>
      <div style={{height:24}}/>
      <button className="btn blue" onClick={()=>go('signup')}>시작하기 →</button>
      <div style={{height:10}}/>
      <button className="btn ghost" onClick={()=>go('login')}>로그인</button>
    </div>
  </div>;
}

/* ───────── 회원가입 (역할 + 추천인코드 + 약관) ───────── */
function Signup({db,commit,go,login,flash}){
  const [step,setStep]=useState(1);
  const [role,setRole]=useState('agent');
  const [f,setF]=useState({name:'',phone:'',pw:'',ref:''});
  const [agree,setAgree]=useState({tos:false,privacy:false,marketing:false});
  const [err,setErr]=useState('');
  const set=(k,v)=>setF({...f,[k]:v});

  // 추천인코드 해석 → 소속 미리보기
  const refInfo = (()=>{
    if(!f.ref) return null;
    const code=f.ref.trim().toUpperCase();
    if(role==='branch'){ return code===HQ_CODE ? {ok:true,text:'본사 관리자 코드 확인 — 새 지점을 개설합니다'} : {ok:false,text:'본사 관리자 코드가 아닙니다'}; }
    if(role==='team'){ const b=db.branches.find(x=>x.code===code); return b?{ok:true,text:`${b.name} 소속 팀장으로 등록`}:{ok:false,text:'해당 지점장 코드를 찾을 수 없습니다'}; }
    const t=db.teams.find(x=>x.code===code); const b=t&&db.branches.find(x=>x.id===t.branchId);
    return t?{ok:true,text:`${b?b.name:''} · ${t.name} 소속 설계사로 등록`}:{ok:false,text:'해당 팀장 코드를 찾을 수 없습니다'};
  })();

  const doSignup=()=>{
    setErr('');
    if(!f.name||f.phone.length<10||f.pw.length<4){ setStep(2); return setErr('이름·휴대폰(10자리↑)·비밀번호(4자리↑)를 확인하세요'); }
    if(db.users.find(u=>u.phone===f.phone)) return setErr('이미 가입된 휴대폰입니다');
    if(!refInfo||!refInfo.ok){ setStep(2); return setErr('추천인 코드를 확인하세요'); }
    if(!agree.tos||!agree.privacy) return setErr('필수 약관에 동의해주세요');
    const code=f.ref.trim().toUpperCase();
    const nd={...db, branches:[...db.branches], teams:[...db.teams], users:[...db.users]};
    const uid=rid('U');
    let branchId=null,teamId=null,recruiterId=null,myCode=null;
    if(role==='branch'){
      branchId=rid('b'); myCode=rid('GN');
      nd.branches.push({id:branchId,name:f.name+' 지점',code:myCode,managerId:uid});
    } else if(role==='team'){
      const b=db.branches.find(x=>x.code===code); branchId=b.id; recruiterId=b.managerId; myCode=rid('TM');
      teamId=rid('t'); nd.teams.push({id:teamId,branchId,name:f.name+' 팀',code:myCode,leaderId:uid});
    } else {
      const t=db.teams.find(x=>x.code===code); teamId=t.id; branchId=t.branchId; recruiterId=t.leaderId;
    }
    nd.users.push({id:uid,name:f.name,phone:f.phone,pw:f.pw,role,branchId,teamId,recruiterId,code:myCode,
      consent:{...agree,at:Date.now()},createdAt:Date.now()});
    commit(nd); flash('가입 완료! 환영합니다 🎉'); login(uid);
  };

  return <div className="scroll">
    <div className="top"><button className="back" onClick={()=>step===1?go('landing'):setStep(step-1)}>‹</button>
      <div style={{fontWeight:800}}>회원가입 <span style={{color:'var(--sub)',fontWeight:600,fontSize:13}}>({step}/3)</span></div></div>
    <div className="pad" style={{paddingTop:6}}>
    {step===1 && <>
      <div className="h1" style={{fontSize:22,marginBottom:6}}>어떤 역할로<br/>시작하시나요?</div>
      <div className="muted" style={{marginBottom:18}}>역할에 따라 관리 범위가 달라집니다.</div>
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {['branch','team','agent'].map(r=>(
          <div key={r} className={'rolecard'+(role===r?' on':'')} onClick={()=>setRole(r)} style={{textAlign:'left',display:'flex',alignItems:'center',gap:14}}>
            <div className="ic">{ROLE[r].ic}</div>
            <div><div className="t">{ROLE[r].label}</div><div className="d">{ROLE[r].d}</div></div>
          </div>))}
      </div>
      <div style={{height:20}}/>
      <button className="btn" onClick={()=>setStep(2)}>다음 →</button>
    </>}

    {step===2 && <>
      <div className="h1" style={{fontSize:22,marginBottom:16}}>정보를 입력하세요</div>
      <div className="field"><label>이름</label><input value={f.name} onChange={e=>set('name',e.target.value)} placeholder="홍길동"/></div>
      <div className="field"><label>휴대폰 (아이디)</label><input value={f.phone} onChange={e=>set('phone',e.target.value.replace(/\D/g,''))} placeholder="01012345678" inputMode="numeric"/></div>
      <div className="field"><label>비밀번호</label><input type="password" value={f.pw} onChange={e=>set('pw',e.target.value)} placeholder="4자리 이상"/></div>
      <div className="field"><label>추천인 코드 {role==='branch'?'(본사 관리자 코드)':role==='team'?'(지점장 코드)':'(팀장 코드)'}</label>
        <input value={f.ref} onChange={e=>set('ref',e.target.value.toUpperCase())} placeholder={role==='branch'?'HQ코드':'예: TM-3C4D'}/>
        {refInfo && <div className={refInfo.ok?'ok':'err'}>{refInfo.ok?'✓ ':'✕ '}{refInfo.text}</div>}
        {role==='agent' && <div className="muted" style={{fontSize:11,marginTop:6}}>데모 팀장 코드: <b>TM-3C4D</b> / 지점장 코드: <b>GN-1A2B</b> / 본사: <b>HQ2026</b></div>}
      </div>
      {err&&<div className="err" style={{marginBottom:10}}>{err}</div>}
      <button className="btn" onClick={()=>{ if(!f.name||f.phone.length<10||f.pw.length<4){return setErr('이름·휴대폰·비밀번호를 확인하세요')} if(!refInfo||!refInfo.ok){return setErr('추천인 코드를 확인하세요')} setErr(''); setStep(3); }}>다음 →</button>
    </>}

    {step===3 && <>
      <div className="h1" style={{fontSize:22,marginBottom:16}}>약관에 동의해주세요</div>
      <div className="card">
        <div className="check" onClick={()=>setAgree({tos:!agree.tos&&agree.privacy?true:!(agree.tos&&agree.privacy),privacy:!agree.tos&&agree.privacy?true:!(agree.tos&&agree.privacy),marketing:agree.marketing})} style={{fontWeight:800,borderBottom:'1px solid var(--line)'}}>
          <div className={'box'+(agree.tos&&agree.privacy&&agree.marketing?' on':'')}>✓</div><div>전체 동의</div></div>
        <Ck on={agree.tos} set={()=>setAgree({...agree,tos:!agree.tos})} label="[필수] 이용약관" onView={()=>go('terms')}/>
        <Ck on={agree.privacy} set={()=>setAgree({...agree,privacy:!agree.privacy})} label="[필수] 개인정보 처리방침" onView={()=>go('privacy')}/>
        <Ck on={agree.marketing} set={()=>setAgree({...agree,marketing:!agree.marketing})} label="[선택] 마케팅 정보 수신"/>
      </div>
      {err&&<div className="err" style={{margin:'10px 0'}}>{err}</div>}
      <div style={{height:16}}/>
      <button className="btn blue" disabled={!agree.tos||!agree.privacy} onClick={doSignup}>가입 완료</button>
    </>}
    </div>
  </div>;
}
function Ck({on,set,label,onView}){
  return <div className="check">
    <div className={'box'+(on?' on':'')} onClick={set}>✓</div>
    <div style={{flex:1}} onClick={set}>{label}</div>
    {onView&&<span className="link" onClick={onView}>보기</span>}
  </div>;
}

/* ───────── 로그인 ───────── */
function Login({db,go,login,flash}){
  const [phone,setPhone]=useState(''),[pw,setPw]=useState(''),[err,setErr]=useState('');
  const submit=()=>{ const u=db.users.find(x=>x.phone===phone&&x.pw===pw); if(!u)return setErr('아이디 또는 비밀번호가 올바르지 않습니다'); login(u.id); };
  const demo=(role)=>{ const u=db.users.find(x=>x.role===role); if(u)login(u.id); };
  return <div className="scroll">
    <div className="top"><button className="back" onClick={()=>go('landing')}>‹</button><div style={{fontWeight:800}}>로그인</div></div>
    <div className="pad">
      <div className="h1" style={{fontSize:22,marginBottom:6}}>다시 오신 것을<br/>환영합니다</div>
      <div className="muted" style={{marginBottom:20}}>보험 전문가 계정으로 로그인하세요.</div>
      <div className="field"><label>휴대폰 (아이디)</label><input value={phone} onChange={e=>setPhone(e.target.value.replace(/\D/g,''))} placeholder="01012345678" inputMode="numeric"/></div>
      <div className="field"><label>비밀번호</label><input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="비밀번호"/></div>
      {err&&<div className="err" style={{marginBottom:10}}>{err}</div>}
      <button className="btn" onClick={submit}>로그인</button>
      <div style={{textAlign:'center',margin:'18px 0',color:'#9AA6BE',fontSize:12}}>— 데모 계정으로 둘러보기 —</div>
      <div className="row" style={{gap:8}}>
        <button className="btn ghost" style={{height:44,fontSize:13}} onClick={()=>demo('branch')}>지점장</button>
        <button className="btn ghost" style={{height:44,fontSize:13}} onClick={()=>demo('team')}>팀장</button>
        <button className="btn ghost" style={{height:44,fontSize:13}} onClick={()=>demo('agent')}>설계사</button>
      </div>
      <div style={{textAlign:'center',marginTop:18,fontSize:13,color:'var(--sub)'}}>아직 계정이 없으신가요? <span className="link" onClick={()=>go('signup')}>회원가입</span></div>
    </div>
  </div>;
}

/* ───────── 이용약관 / 개인정보 처리방침 ───────── */
function Legal({kind,go}){
  const T = kind==='terms'
   ? {title:'이용약관', body:`제1조 (목적)\n본 약관은 인슈런스 석세스 프로그램(이하 "서비스")의 이용 조건 및 절차, 회사와 회원의 권리·의무를 규정합니다.\n\n제2조 (정의)\n1. "회원"이란 역할(지점장·팀장·설계사)로 가입하여 서비스를 이용하는 자를 말합니다.\n2. "추천인 코드"란 상위 조직(본사·지점장·팀장)에의 소속을 연결하는 코드입니다.\n\n제3조 (서비스의 내용)\n고객관리, 매출·업적관리, 리쿠르팅·정착관리, 승급관리, 병원(청구지원)·기념일 관리 등을 제공합니다.\n\n제4조 (회원의 의무)\n회원은 고객의 개인정보 및 보험계약 정보를 관계 법령에 따라 안전하게 취급해야 합니다.\n\n제5조 (계약 해지)\n회원은 언제든 탈퇴할 수 있으며, 관계 법령이 정한 기간 동안 보관이 필요한 정보는 예외로 합니다.\n\n※ 본 약관은 시안이며 정식 서비스 출시 전 법무 검토 후 확정됩니다.`}
   : {title:'개인정보 처리방침', body:`인슈런스 석세스 프로그램(이하 "회사")은 개인정보보호법 등 관계 법령을 준수합니다.\n\n1. 수집 항목\n- 회원: 이름, 휴대폰번호, 비밀번호, 역할, 소속(추천인 코드), 동의 이력\n- 고객관리 목적: 회원이 입력하는 고객 정보(생일·기념일·계약 등)\n\n2. 이용 목적\n영업 관리, 조직(지점·팀) 위계 구성, 유지율·정착률 향상을 위한 알림·통계 제공.\n\n3. 보유 기간\n회원 탈퇴 시 지체 없이 파기하되, 관계 법령에 따라 일정 기간 보관할 수 있습니다.\n\n4. 제3자 제공\n법령에 근거하거나 회원의 동의가 있는 경우를 제외하고 제공하지 않습니다.\n\n5. 이용자 권리\n이용자는 자신의 개인정보 열람·정정·삭제·처리정지를 요청할 수 있습니다.\n\n6. 개인정보 보호책임자\n(정식 출시 시 지정·공개)\n\n※ 본 방침은 시안이며 정식 출시 전 법무 검토 후 확정됩니다.`};
  return <div className="scroll">
    <div className="top"><button className="back" onClick={()=>go('signup')}>‹</button><div style={{fontWeight:800}}>{T.title}</div></div>
    <div className="pad"><div className="legal">{T.body}</div></div>
  </div>;
}

/* ───────── 홈 (역할별 스코프) ───────── */
function Home({db,me,logout,flash,commit}){
  const [tab,setTab]=useState('home');
  const [openCust,setOpenCust]=useState(null); // 고객 상세 id
  const [addCust,setAddCust]=useState(false);
  const branch=db.branches.find(b=>b.id===me.branchId);
  const team=db.teams.find(t=>t.id===me.teamId);

  // 역할별 가시 범위
  const scopeUsers = db.users.filter(u=>{
    if(me.role==='agent') return u.id===me.id;
    if(me.role==='team')  return u.teamId===me.teamId;
    return u.branchId===me.branchId; // branch
  });
  const agents = scopeUsers.filter(u=>u.role==='agent');
  const myCustomers = db.customers.filter(c=>scopeUsers.some(u=>u.id===c.ownerId));
  const todos = buildTodos(myCustomers);

  // 고객 저장/수정/액션
  const saveCustomer=(cst)=>{ const nd={...db,customers:[...db.customers]};
    const i=nd.customers.findIndex(x=>x.id===cst.id);
    if(i>=0) nd.customers[i]=cst; else nd.customers.push({...cst,id:'C'+Date.now(),ownerId:me.id});
    commit(nd); };
  const markContact=(cid)=>{ const nd={...db,customers:db.customers.map(c=>c.id===cid?{...c,lastContact:new Date().toISOString().slice(0,10)}:c)}; commit(nd); flash('연락 완료로 기록했어요 ✓'); };

  if(addCust) return <CustomerForm me={me} onSave={(c)=>{saveCustomer(c);setAddCust(false);flash('고객 등록 완료 ✓');}} onCancel={()=>setAddCust(false)}/>;
  if(openCust){ const c=db.customers.find(x=>x.id===openCust); if(c) return <CustomerDetail c={c} onBack={()=>setOpenCust(null)} onContact={()=>markContact(c.id)} onSave={(nc)=>{saveCustomer(nc);flash('저장됨 ✓');}}/>; }

  return <div className="scroll" style={{paddingBottom:0,minHeight:'100dvh',display:'flex',flexDirection:'column'}}>
    <div className="pad" style={{flex:1,overflowY:'auto'}}>
      <div className="row" style={{justifyContent:'space-between'}}>
        <div><div style={{fontWeight:900,fontSize:18}}>{me.name} <span className={'chip '+ROLE[me.role].chip}>{ROLE[me.role].label}</span></div>
          <div className="muted" style={{fontSize:12.5}}>{branch?branch.name:''}{team?' · '+team.name:''}</div></div>
        <button className="back" onClick={logout} title="로그아웃">⏻</button>
      </div>

      {tab==='home' && (()=>{
        const allC=myCustomers.flatMap(c=>c.contracts||[]);
        const ret=allC.length?Math.round(allC.filter(x=>x.status==='정상').length/allC.length*100):100;
        return <>
        <div className="row" style={{gap:10,marginTop:16}}>
          {me.role==='agent'
            ? <><div className="stat"><div className="v">{todos.length}</div><div className="l">오늘 할 일</div></div>
                <div className="stat"><div className="v" style={{color:ret<80?'#E23B4E':'inherit'}}>{ret}%</div><div className="l">내 유지율</div></div>
                <div className="stat"><div className="v">{myCustomers.length}</div><div className="l">관리 고객</div></div></>
            : <><div className="stat"><div className="v">{agents.length}</div><div className="l">{me.role==='branch'?'지점 설계사':'팀원'}</div></div>
                <div className="stat"><div className="v">{myCustomers.length}</div><div className="l">지점 고객</div></div>
                <div className="stat"><div className="v" style={{color:ret<80?'#E23B4E':'inherit'}}>{ret}%</div><div className="l">평균 유지율</div></div></>}
        </div>

        <div className="row" style={{justifyContent:'space-between',margin:'18px 0 8px'}}>
          <div style={{fontWeight:900,fontSize:16}}>💡 오늘의 할 일 <span style={{color:'var(--blue)'}}>{todos.length}</span></div>
          {me.role==='agent'&&<button className="chip tag-branch" onClick={()=>setAddCust(true)}>＋ 고객</button>}
        </div>
        {todos.length===0
          ? <div className="card"><div className="muted">오늘 급한 할 일이 없어요. 고객을 등록하면 생일·기념일·미납·만기·병원 케어가 자동으로 잡혀요.</div></div>
          : <div className="card" style={{padding:'2px 14px'}}>
              {todos.slice(0,12).map((it,i)=><div key={i} className="listrow" onClick={()=>setOpenCust(it.cust.id)}>
                <div style={{width:34,height:34,borderRadius:10,background:it.color+'1A',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,flex:'none'}}>{it.icon}</div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:13.5}}>{it.cust.name} <span style={{color:'var(--sub)',fontWeight:600}}>· {it.text}</span></div>
                  <div style={{fontSize:11}}><span style={{color:it.color,fontWeight:800}}>{it.type}</span></div>
                </div>
                <div style={{fontSize:11,fontWeight:900,color:it.color}}>{ddLabel(it.dd)}</div>
              </div>)}
            </div>}

        {me.role!=='agent' && <div className="codebox" style={{marginTop:16}}>
          <div style={{fontSize:12,opacity:.8}}>내 추천인 코드 (하위 초대용)</div>
          <div className="c">{me.code||'-'}</div>
          <div style={{fontSize:11,opacity:.7,marginTop:4}}>{me.role==='branch'?'팀장':'설계사'}가 이 코드로 가입하면 자동 소속됩니다</div>
        </div>}
      </>;})()}

      {tab==='customers' && <CustomerList customers={myCustomers} me={me} onOpen={setOpenCust} onAdd={()=>setAddCust(true)}/>}

      {tab==='performance' && <Performance db={db} me={me} scopeUsers={scopeUsers}/>}

      {tab==='promotion' && <Promotion db={db} me={me} scopeUsers={scopeUsers}/>}

      {tab==='claims' && <Claims db={db} me={me} scopeUsers={scopeUsers} commit={commit} flash={flash}/>}

      {tab==='org' && <OrgView db={db} me={me} commit={commit} flash={flash}/>}

/* ───────── 고객 리스트 ───────── */
function CustomerList({customers,me,onOpen,onAdd}){
  const [q,setQ]=useState('');
  const list=customers.filter(c=>!q||c.name.includes(q)||(c.job||'').includes(q));
  const badge=(c)=>{ if((c.contracts||[]).some(x=>x.unpaid>=2))return{t:'실효위험',col:'#E23B4E'};
    if((c.contracts||[]).some(x=>x.unpaid>=1))return{t:'미납',col:'#C97A00'};
    if(c.surgery&&daysSince(c.surgery)>=0&&daysSince(c.surgery)<=14)return{t:'병원케어',col:'#7A5BFF'};
    const bd=ddayAnnual(c.birthday); if(bd!==null&&bd<=7)return{t:'생일 D-'+bd,col:'#12A150'};
    return null; };
  return <div style={{marginTop:16}}>
    <div className="row" style={{justifyContent:'space-between',marginBottom:12}}>
      <div style={{fontWeight:900,fontSize:17}}>🧑‍🤝‍🧑 고객관리 <span style={{color:'var(--blue)'}}>{customers.length}</span></div>
      {me.role==='agent'&&<button className="chip tag-branch" onClick={onAdd}>＋ 고객 등록</button>}
    </div>
    <div className="field"><input value={q} onChange={e=>setQ(e.target.value)} placeholder="이름·직업 검색"/></div>
    <div className="card" style={{padding:'2px 14px'}}>
      {list.length?list.map(c=>{const b=badge(c);return <div key={c.id} className="listrow" onClick={()=>onOpen(c.id)}>
        <div className="ava">{c.name[0]}</div>
        <div style={{flex:1}}><div style={{fontWeight:700,fontSize:14}}>{c.name} <span className="muted" style={{fontSize:11.5}}>{c.job}</span></div>
          <div className="muted" style={{fontSize:11.5}}>{(c.contracts||[]).map(x=>x.product).join(', ')||'계약 없음'}</div></div>
        {b&&<span className="chip" style={{background:b.col+'1A',color:b.col,fontSize:10}}>{b.t}</span>}
        <div style={{color:'var(--blue)',fontWeight:800}}>›</div>
      </div>;}):<div className="muted" style={{padding:'14px 0'}}>고객이 없습니다.</div>}
    </div>
    {me.role!=='agent'&&<div className="muted" style={{textAlign:'center',fontSize:11,marginTop:10}}>ⓘ {me.role==='branch'?'지점':'팀'} 소속 설계사의 고객을 조회합니다</div>}
  </div>;
}

/* ───────── 고객 등록/수정 폼 ───────── */
function CustomerForm({me,cust,onSave,onCancel}){
  const init=cust||{name:'',job:'',income:'',birthday:'',anniversary:'',childbirth:'',surgery:'',discharge:'',lastContact:new Date().toISOString().slice(0,10),memo:'',contracts:[{product:'',monthly:'',status:'정상',unpaid:0,maturity:''}]};
  const [f,setF]=useState(init); const [err,setErr]=useState('');
  const s=(k,v)=>setF({...f,[k]:v});
  const sc=(k,v)=>{const cs=[...(f.contracts||[{}])];cs[0]={...cs[0],[k]:v};setF({...f,contracts:cs})};
  const ct=(f.contracts&&f.contracts[0])||{};
  const submit=()=>{ if(!f.name)return setErr('이름을 입력하세요');
    onSave({...f,income:+f.income||0,contracts:(f.contracts||[]).filter(x=>x.product).map(x=>({...x,monthly:+x.monthly||0,unpaid:+x.unpaid||0}))}); };
  const F=(label,k,ph,type)=><div className="field"><label>{label}</label><input type={type||'text'} value={f[k]||''} onChange={e=>s(k,e.target.value)} placeholder={ph}/></div>;
  return <div className="scroll">
    <div className="top"><button className="back" onClick={onCancel}>‹</button><div style={{fontWeight:800}}>{cust?'고객 수정':'고객 등록'}</div></div>
    <div className="pad" style={{paddingTop:4}}>

      {F('하는 일 (직업)','job','자영업 (카페 운영)')}
      {F('월 수입 (만원)','income','450','number')}
      <div className="row" style={{gap:10}}><div style={{flex:1}}>{F('생일','birthday','','date')}</div><div style={{flex:1}}>{F('결혼기념일','anniversary','','date')}</div></div>
      {F('출산(예정)일','childbirth','','date')}
      <div className="row" style={{gap:10}}><div style={{flex:1}}>{F('수술일','surgery','','date')}</div><div style={{flex:1}}>{F('퇴원일','discharge','','date')}</div></div>
      {F('마지막 연락일','lastContact','','date')}
      <div className="card" style={{margin:'4px 0 14px'}}>
        <div style={{fontWeight:800,marginBottom:10}}>계약 정보</div>
        <div className="field" style={{marginBottom:10}}><label>상품</label><input value={ct.product||''} onChange={e=>sc('product',e.target.value)} placeholder="암보험 · 실손보험"/></div>
        <div className="row" style={{gap:10}}>
          <div style={{flex:1}} className="field"><label>월납(만원)</label><input type="number" value={ct.monthly||''} onChange={e=>sc('monthly',e.target.value)}/></div>
          <div style={{flex:1}} className="field"><label>상태</label><select value={ct.status||'정상'} onChange={e=>sc('status',e.target.value)}><option>정상</option><option>미납</option><option>실효</option></select></div>
        </div>
        <div className="row" style={{gap:10}}>
          <div className="field" style={{flex:1,marginBottom:0}}><label>미납 개월</label><input type="number" value={ct.unpaid||0} onChange={e=>sc('unpaid',e.target.value)}/></div>
          <div className="field" style={{flex:1,marginBottom:0}}><label>만기/갱신일</label><input type="date" value={ct.maturity||''} onChange={e=>sc('maturity',e.target.value)}/></div>
        </div>
      </div>
      <div className="field"><label>메모</label><input value={f.memo||''} onChange={e=>s('memo',e.target.value)} placeholder="특이사항"/></div>
      {err&&<div className="err" style={{marginBottom:10}}>{err}</div>}
      <button className="btn blue" onClick={submit}>{cust?'저장':'등록'}</button>
    </div>
  </div>;
}

/* ───────── 리쿠르팅: 퍼널·정착률·역산·13주 신인관리·파이프라인 ───────── */
function Recruiting({db,me,commit,flash}){
  const inScope=(r)=> me.role==='branch' ? r.branchId===me.branchId : r.teamId===me.teamId;
  const recs=db.recruits.filter(inScope);
  const byStage=(s)=>recs.filter(r=>r.stage===s);
  const post = byStage('위촉').length+byStage('교육').length+byStage('정착').length;
  const settleRate = post>0 ? Math.round(byStage('정착').length/post*100) : 0;
  const [addOpen,setAddOpen]=useState(false);
  const [nf,setNf]=useState({name:'',phone:'',source:'지인소개'});
  const sc={가망:'#5B6781',면접:'#C97A00',위촉:'#1F5BFF',교육:'#7A5BFF',정착:'#12A150'};

  const advance=(r)=>{ const i=REC_STAGES.indexOf(r.stage); if(i>=REC_STAGES.length-1)return;
    commit({...db,recruits:db.recruits.map(x=>x.id===r.id?{...x,stage:REC_STAGES[i+1]}:x)}); flash(r.name+' → '+REC_STAGES[i+1]); };
  const addRec=()=>{ if(!nf.name)return flash('이름을 입력하세요');
    commit({...db,recruits:[...db.recruits,{id:'R'+Date.now(),ownerId:me.id,branchId:me.branchId,
      teamId:me.role==='team'?me.teamId:(db.teams.find(t=>t.branchId===me.branchId)||{}).id,
      name:nf.name,phone:nf.phone,stage:'가망',source:nf.source,addedAt:new Date().toISOString().slice(0,10)}]});
    setNf({name:'',phone:'',source:'지인소개'}); setAddOpen(false); flash('후보 등록 ✓'); };
  const targetSettle=5, needAppoint = settleRate>0 ? Math.ceil(targetSettle/(settleRate/100)) : '-';

  return <div>
    <div className="card"><b>리쿠르팅 퍼널</b>
      <div style={{display:'flex',gap:6,marginTop:12}}>
        {REC_STAGES.map(s=>{const n=byStage(s).length;return <div key={s} style={{flex:1,textAlign:'center'}}>
          <div style={{height:6,borderRadius:3,background:sc[s]}}/>
          <div style={{fontWeight:900,fontSize:17,marginTop:6,color:sc[s]}}>{n}</div>
          <div className="muted" style={{fontSize:10.5}}>{s}</div></div>;})}</div></div>

    <div className="row" style={{gap:10,marginTop:12,alignItems:'stretch'}}>
      <div className="stat" style={{flex:1}}><div className="v" style={{color:settleRate<50?'#E23B4E':'#12A150'}}>{settleRate}%</div><div className="l">정착률</div></div>
      <div className="card" style={{flex:2,display:'flex',flexDirection:'column',justifyContent:'center'}}>
        <div style={{fontWeight:800,fontSize:13}}>🎯 퍼널 역산</div>
        <div className="muted" style={{fontSize:12,marginTop:3}}>정착 <b>{targetSettle}명</b> 목표 → 위촉 <b style={{color:'var(--blue)'}}>{needAppoint}명</b> 필요</div></div></div>

    {byStage('교육').length>0 && <div className="card" style={{marginTop:12}}>
      <b>🎓 신인 13주 도입 관리</b>
      {byStage('교육').map(r=>{const w=r.weekAct||[];const avg=w.length?w.reduce((a,b)=>a+b,0)/w.length:0;const risk=avg<2.5;
        return <div key={r.id} style={{marginTop:10,paddingTop:10,borderTop:'1px solid var(--line)'}}>
          <div className="row" style={{justifyContent:'space-between'}}><b>{r.name}</b>
            {risk?<span className="chip" style={{background:'#E23B4E1A',color:'#E23B4E',fontSize:10.5}}>⚠️ 정착 위험</span>:<span className="chip tag-team" style={{fontSize:10.5}}>정상</span>}</div>
          <div className="row" style={{gap:4,marginTop:8,alignItems:'flex-end',height:44}}>{w.map((a,i)=><div key={i} style={{flex:1,textAlign:'center'}}>
            <div style={{height:Math.max(4,a*9),borderRadius:3,background:a<2?'#E23B4E':'#1F5BFF',marginBottom:3}}/>
            <div className="muted" style={{fontSize:9}}>{i+1}주</div></div>)}</div>
          <div className="muted" style={{fontSize:11,marginTop:4}}>주간 활동(TA/면담) 평균 {avg.toFixed(1)}건 {risk?'· 활동 독려 필요':''}</div>
        </div>;})}</div>}

    <div className="row" style={{justifyContent:'space-between',margin:'16px 0 8px'}}>
      <b>후보 파이프라인 ({recs.length})</b>
      <button className="chip tag-branch" onClick={()=>setAddOpen(!addOpen)}>＋ 후보</button></div>
    {addOpen && <div className="card" style={{marginBottom:10}}>
      <div className="field" style={{marginBottom:8}}><input value={nf.name} onChange={e=>setNf({...nf,name:e.target.value})} placeholder="후보 이름"/></div>
      <div className="row" style={{gap:8}}>
        <input style={{flex:1,height:46,border:'1.5px solid var(--line)',borderRadius:11,padding:'0 12px'}} value={nf.phone} onChange={e=>setNf({...nf,phone:e.target.value})} placeholder="연락처"/>
        <select style={{height:46,border:'1.5px solid var(--line)',borderRadius:11,padding:'0 10px',background:'#fff'}} value={nf.source} onChange={e=>setNf({...nf,source:e.target.value})}><option>지인소개</option><option>채용공고</option><option>DB</option></select></div>
      <button className="btn" style={{height:46,marginTop:10}} onClick={addRec}>등록</button></div>}
    <div className="card" style={{padding:'2px 14px'}}>
      {recs.length?recs.map(r=><div key={r.id} className="listrow">
        <div className="ava" style={{background:sc[r.stage]}}>{r.name[0]}</div>
        <div style={{flex:1}}><div style={{fontWeight:700,fontSize:14}}>{r.name} <span className="chip" style={{background:sc[r.stage]+'1A',color:sc[r.stage],fontSize:10}}>{r.stage}</span></div>
          <div className="muted" style={{fontSize:11.5}}>{r.source} · {r.phone}</div></div>
        {r.stage!=='정착' && <button className="chip tag-branch" onClick={()=>advance(r)}>다음 →</button>}
      </div>):<div className="muted" style={{padding:'12px 0'}}>후보가 없습니다.</div>}</div>
  </div>;
}

/* ───────── 조직관리: 구성원(팀별/개별) + 리쿠르팅 ───────── */
function OrgView({db,me,commit,flash}){
  const [section,setSection]=useState('member');
  return <div style={{marginTop:16}}>
    <div className="seg" style={{marginBottom:14}}>
      <button className={section==='member'?'on':''} onClick={()=>setSection('member')}>구성원</button>
      <button className={section==='recruit'?'on':''} onClick={()=>setSection('recruit')}>리쿠르팅</button>
    </div>
    {section==='recruit' ? <Recruiting db={db} me={me} commit={commit} flash={flash}/> : <Members db={db} me={me}/>}
  </div>;
}
function Members({db,me}){
  const [mode,setMode]=useState(me.role==='branch'?'team':'agent');
  const teams=db.teams.filter(t=>t.branchId===me.branchId);
  const agentsOf=(tid)=>db.users.filter(u=>u.role==='agent'&&u.teamId===tid);
  const allAgents=db.users.filter(u=>u.role==='agent'&&(me.role==='branch'?u.branchId===me.branchId:u.teamId===me.teamId));

  return <div>
    {me.role==='branch' && <div className="seg" style={{marginBottom:14}}>
      <button className={mode==='team'?'on':''} onClick={()=>setMode('team')}>팀별 보기</button>
      <button className={mode==='agent'?'on':''} onClick={()=>setMode('agent')}>전체 설계사</button>
    </div>}

    {me.role==='branch'&&mode==='team' && teams.map(t=>{
      const ms=agentsOf(t.id); const lead=db.users.find(u=>u.id===t.leaderId);
      return <div key={t.id} className="card" style={{marginBottom:12}}>
        <div className="row" style={{justifyContent:'space-between'}}>
          <div><b>{t.name}</b> <span className="chip tag-team">{ms.length}명</span></div>
          <div className="muted" style={{fontSize:12}}>팀장 {lead?lead.name:'-'}</div></div>
        <div style={{marginTop:8}}>{ms.length?ms.map(a=><Person key={a.id} u={a}/>):<div className="muted" style={{fontSize:12.5,padding:'8px 0'}}>팀원이 없습니다</div>}</div>
      </div>;
    })}

    {(mode==='agent'||me.role==='team') && <div className="card">
      <div style={{fontWeight:800,marginBottom:4}}>{me.role==='branch'?'지점 전체 설계사':'팀원'} ({allAgents.length})</div>
      {allAgents.length?allAgents.map(a=><Person key={a.id} u={a} team={db.teams.find(t=>t.id===a.teamId)}/>):<div className="muted" style={{padding:'8px 0'}}>설계사가 없습니다</div>}
    </div>}
  </div>;
}
/* ───────── 병원 · 실손청구 관리 ───────── */
function Claims({db,me,scopeUsers,commit,flash}){
  const claims=db.claims.filter(cl=>scopeUsers.some(u=>u.id===cl.ownerId));
  const custName=(id)=>(db.customers.find(c=>c.id===id)||{}).name||'-';
  const reqDocs=(amt)=> amt>=50?['진단서','진료비내역','영수증']:['입퇴원확인서','진료비내역','영수증'];
  const docLabel={진단서:'진단서',입퇴원확인서:'입퇴원확인서',진료비내역:'진료비 세부내역서',영수증:'진료비 영수증'};
  const toggleDoc=(cl,d)=> commit({...db,claims:db.claims.map(x=>x.id===cl.id?{...x,docs:{...x.docs,[d]:!x.docs[d]}}:x)});
  const advance=(cl)=>{ const i=CLAIM_STATUS.indexOf(cl.status); if(i>=CLAIM_STATUS.length-1)return;
    commit({...db,claims:db.claims.map(x=>x.id===cl.id?{...x,status:CLAIM_STATUS[i+1]}:x)}); flash(custName(cl.customerId)+' → '+CLAIM_STATUS[i+1]); };

  return <div style={{marginTop:16}}>
    <div style={{fontWeight:900,fontSize:17}}>🏥 병원 · 실손청구</div>
    <div className="muted" style={{fontSize:12,margin:'4px 0 12px'}}>입원·수술 고객의 청구를 도와 유지율·신뢰·소개를 높입니다.</div>
    {claims.length===0 && <div className="card"><div className="muted">진행 중인 청구 건이 없습니다.</div></div>}
    {claims.map(cl=>{
      const req=reqDocs(cl.amount); const missing=req.filter(d=>!cl.docs[d]);
      const dd=ddayAbs(cl.dischargeDate); const si=CLAIM_STATUS.indexOf(cl.status);
      return <div key={cl.id} className="card" style={{marginBottom:12}}>
        <div className="row" style={{justifyContent:'space-between'}}>
          <div><b>{custName(cl.customerId)}</b> <span className="chip tag-agent" style={{fontSize:10}}>{cl.type}</span></div>
          <span className="chip" style={{background:si===3?'#12A1501A':'#1F5BFF1A',color:si===3?'#12A150':'#1F5BFF',fontSize:10.5}}>{cl.status}</span></div>
        <div className="muted" style={{fontSize:11.5,marginTop:4}}>{cl.hospital} · 입원 {cl.admitDate} · 퇴원 {cl.dischargeDate}{dd!==null&&dd>=0&&si<3?` (D-${dd})`:''} · 청구 {won(cl.amount)}</div>

        <div className="row" style={{gap:4,margin:'12px 0'}}>
          {CLAIM_STATUS.map((s,i)=><div key={s} style={{flex:1,textAlign:'center'}}>
            <div style={{height:5,borderRadius:3,background:i<=si?'#1F5BFF':'#E4EAF3'}}/>
            <div style={{fontSize:9.5,marginTop:3,color:i<=si?'var(--blue)':'var(--sub)',fontWeight:i===si?800:600}}>{s}</div></div>)}
        </div>

        <div style={{background:'#F5F8FF',borderRadius:12,padding:12}}>
          <div style={{fontWeight:800,fontSize:12.5,marginBottom:6}}>📋 필요서류 {cl.amount>=50?'(50만원↑ · 진단서 필수)':'(50만원↓ · 입퇴원확인서로 대체 가능)'}</div>
          {req.map(d=><div key={d} className="row" onClick={()=>toggleDoc(cl,d)} style={{padding:'5px 0'}}>
            <div style={{width:20,height:20,borderRadius:6,border:'2px solid '+(cl.docs[d]?'#12A150':'#CBD5E8'),background:cl.docs[d]?'#12A150':'#fff',color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,flex:'none'}}>{cl.docs[d]?'✓':''}</div>
            <div style={{fontSize:13,marginLeft:8,color:cl.docs[d]?'var(--ink)':'var(--sub)'}}>{docLabel[d]}</div></div>)}
          {missing.length>0 && <div style={{fontSize:11,color:'#C97A00',marginTop:6,fontWeight:700}}>미비 {missing.length}건 — 고객에게 안내하세요</div>}
        </div>
        {cl.status!=='지급완료' && <button className="btn" style={{height:44,marginTop:10}} disabled={si===0&&missing.length>0} onClick={()=>advance(cl)}>{si===0?(missing.length>0?'서류 미비':'접수하기'):'다음 단계 →'}</button>}
      </div>;
    })}
    <div className="muted" style={{textAlign:'center',fontSize:11,marginTop:8}}>ⓘ 서류안내·상태는 데모 · 실제 청구접수 연동은 백엔드 후</div>
  </div>;
}

/* ───────── 승급/직급 관리 ───────── */
function Promotion({db,me,scopeUsers}){
  const m=userMetrics(db,me);
  const ci=gradeIdx(me.grade); const cur=GRADES[ci]; const next=GRADES[ci+1];
  const mkRow=(label,val,req,unit,ape)=>({label,val,req,unit,ape,pct:req?Math.min(100,Math.round(val/req*100)):100,ok:val>=req});
  let rows=[],ready=false,apeShort=0;
  if(next){
    rows=[mkRow('환산성적 APE',m.ape,next.req.ape,'만',true), mkRow('유지율',m.ret,next.req.ret,'%'),
      ...(next.req.rec>0?[mkRow('정착 리쿠르팅',m.rec,next.req.rec,'명')]:[])];
    ready=rows.every(r=>r.ok); apeShort=Math.max(0,next.req.ape-m.ape);
  }
  const isMgr=me.role!=='agent'; const teamAgents=scopeUsers.filter(u=>u.role==='agent');
  return <div style={{marginTop:16}}>
    <div className="codebox" style={{background:'linear-gradient(135deg,#0B1B3F,#1F5BFF)'}}>
      <div style={{fontSize:12,opacity:.8}}>현재 직급</div>
      <div style={{fontSize:23,fontWeight:900,marginTop:2}}>{cur.emoji} {cur.name}</div></div>
    {next ? <div className="card" style={{marginTop:14}}>
      <div className="row" style={{justifyContent:'space-between'}}>
        <b>다음 등급 · {next.emoji} {next.name}</b>{ready&&<span className="chip tag-team">승급 가능! 🎉</span>}</div>
      <div style={{marginTop:12}}>
        {rows.map((r,i)=><div key={i} style={{marginBottom:12}}>
          <div className="row" style={{justifyContent:'space-between',marginBottom:4}}>
            <span style={{fontSize:13,fontWeight:700}}>{r.label}</span>
            <span style={{fontSize:12,fontWeight:800,color:r.ok?'#12A150':'#C97A00'}}>{r.ape?won(r.val):r.val+r.unit} / {r.ape?won(r.req):r.req+r.unit} {r.ok?'✓':''}</span></div>
          <div style={{height:8,borderRadius:5,background:'#EEF2F8',overflow:'hidden'}}>
            <div style={{height:'100%',width:r.pct+'%',borderRadius:5,background:r.ok?'#12A150':'linear-gradient(90deg,#1F5BFF,#38A4FF)',transition:'width .6s'}}/></div></div>)}
      </div>
      <div className="card" style={{background:'#F5F8FF',marginTop:6}}>
        <div style={{fontWeight:800,fontSize:13}}>🔮 승급 시뮬레이터</div>
        <div className="muted" style={{fontSize:12,marginTop:3}}>{ready?'모든 요건 충족 — 이번 달 승급 대상입니다! 🎉':apeShort>0?`이번 달 APE ${won(apeShort)} 더 달성하면 승급에 가까워집니다.`:'유지율·리쿠르팅 요건을 채우면 승급합니다.'}</div></div>
    </div> : <div className="card" style={{marginTop:14}}><div className="muted">최고 등급입니다 💎</div></div>}

    {isMgr && teamAgents.length>0 && <div className="card" style={{marginTop:14}}>
      <b>팀원 진급 현황</b>
      <div style={{marginTop:8}}>
        {teamAgents.map(u=>{const um=userMetrics(db,u);const uci=gradeIdx(u.grade);const un=GRADES[uci+1];
          let pct=100;const risk=um.ret<80;
          if(un){pct=Math.round(Math.min(Math.min(100,um.ape/(un.req.ape||1)*100),Math.min(100,um.ret/(un.req.ret||1)*100),un.req.rec?Math.min(100,um.rec/un.req.rec*100):100));}
          return <div key={u.id} className="listrow">
            <div className="ava">{u.name[0]}</div>
            <div style={{flex:1}}>
              <div style={{fontWeight:700,fontSize:13.5}}>{u.name} <span className="muted" style={{fontSize:11}}>{GRADES[uci].emoji}{GRADES[uci].name}</span></div>
              <div style={{height:6,borderRadius:3,background:'#EEF2F8',overflow:'hidden',marginTop:4}}>
                <div style={{height:'100%',width:pct+'%',background:pct>=100?'#12A150':'linear-gradient(90deg,#1F5BFF,#38A4FF)'}}/></div></div>
            {risk?<span className="chip" style={{background:'#E23B4E1A',color:'#E23B4E',fontSize:10}}>자격 위험</span>:pct>=100?<span className="chip tag-team" style={{fontSize:10}}>승급임박</span>:<span style={{fontSize:12,fontWeight:800,color:'var(--blue)'}}>{pct}%</span>}
          </div>;})}
      </div></div>}
    <div className="muted" style={{textAlign:'center',fontSize:11,marginTop:12}}>ⓘ 승급 요건은 데모 기준 · 실제 규정은 관리자 페이지에서 설정</div>
  </div>;
}

/* ───────── 매출/업적 (역할별 집계) ───────── */
function Performance({db,me,scopeUsers}){
  const agentsIn = scopeUsers.filter(u=>u.role==='agent');
  const sales = db.sales.filter(s=>scopeUsers.some(u=>u.id===s.agentId));
  const tm = monthKey(0);
  const cur = sales.filter(s=>s.month===tm);
  const ape = cur.reduce((a,s)=>a+s.ape,0);
  const cnt = cur.length;
  const goal = me.role==='agent' ? (me.goalApe||300) : (agentsIn.reduce((a,u)=>a+(u.goalApe||300),0)||300);
  const rate = Math.min(100,Math.round(ape/goal*100));
  const comm = {수령:0,미수:0,예상:0,환수:0}; cur.forEach(s=>comm[s.commStatus]=(comm[s.commStatus]||0)+s.commission);
  const trend = [5,4,3,2,1,0].map(o=>({mk:monthKey(o), ape:sales.filter(s=>s.month===monthKey(o)).reduce((a,s)=>a+s.ape,0)}));
  const tmax = Math.max(1,...trend.map(t=>t.ape));
  // 상품 믹스
  const mix={}; cur.forEach(s=>mix[s.product]=(mix[s.product]||0)+1);
  // 랭킹(관리자)
  const rank = agentsIn.map(u=>({u,ape:cur.filter(s=>s.agentId===u.id).reduce((a,s)=>a+s.ape,0),
    cnt:cur.filter(s=>s.agentId===u.id).length})).sort((a,b)=>b.ape-a.ape);
  const rmax=Math.max(1,...rank.map(r=>r.ape));
  const isMgr = me.role!=='agent';

  return <div style={{marginTop:16}}>
    <div style={{fontWeight:900,fontSize:17,marginBottom:12}}>📈 매출·업적 <span className="muted" style={{fontSize:12,fontWeight:600}}>({mLabel(tm)} 기준)</span></div>

    {/* 이번달 요약 */}
    <div className="row" style={{gap:10}}>
      <div className="stat"><div className="v">{cnt}건</div><div className="l">신계약</div></div>
      <div className="stat"><div className="v">{won(ape)}</div><div className="l">환산성적(APE)</div></div>
      <div className="stat"><div className="v">{isMgr?agentsIn.length:won(cur.reduce((a,s)=>a+Math.round(s.ape/12),0))}</div><div className="l">{isMgr?'설계사':'월납합'}</div></div>
    </div>

    {/* 목표 달성률 */}
    <div className="card" style={{marginTop:14}}>
      <div className="row" style={{justifyContent:'space-between'}}><b>목표 달성률</b><span style={{fontWeight:900,color:'var(--blue)'}}>{rate}%</span></div>
      <div style={{height:10,borderRadius:6,background:'#EEF2F8',overflow:'hidden',margin:'10px 0 6px'}}>
        <div style={{height:'100%',width:rate+'%',borderRadius:6,background:'linear-gradient(90deg,#1F5BFF,#38A4FF)',transition:'width .6s'}}/></div>
      <div className="muted" style={{fontSize:12}}>{won(ape)} / 목표 {won(goal)} · {ape>=goal?'목표 달성! 🎉':'목표까지 '+won(goal-ape)}</div>
    </div>

    {/* 수수료 */}
    <div className="card" style={{marginTop:12}}>
      <b>수수료 현황</b>
      <div className="row" style={{gap:8,marginTop:10}}>
        {[['수령','#12A150'],['미수','#C97A00'],['예상','#1F5BFF'],['환수','#E23B4E']].map(([k,col])=>(
          <div key={k} style={{flex:1,textAlign:'center',background:col+'12',borderRadius:12,padding:'10px 4px'}}>
            <div style={{fontWeight:900,color:col,fontSize:15}}>{won(comm[k]||0)}</div><div className="muted" style={{fontSize:10.5}}>{k}</div></div>))}
      </div>
    </div>

    {/* 월별 추이 */}
    <div className="card" style={{marginTop:12}}>
      <b>월별 추이 (APE)</b>
      <div className="row" style={{alignItems:'flex-end',gap:8,height:110,marginTop:14}}>
        {trend.map((t,i)=><div key={i} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:5}}>
          <div style={{fontSize:10,fontWeight:800,color:'var(--sub)'}}>{t.ape?won(t.ape):''}</div>
          <div style={{width:'70%',height:Math.round(t.ape/tmax*80)+4,borderRadius:6,
            background:i===trend.length-1?'linear-gradient(180deg,#1F5BFF,#38A4FF)':'#D7E0F5',transition:'height .5s'}}/>
          <div style={{fontSize:10,color:'var(--sub)'}}>{mLabel(t.mk)}</div></div>)}
      </div>
    </div>

    {/* 상품 믹스 */}
    {Object.keys(mix).length>0 && <div className="card" style={{marginTop:12}}>
      <b>상품 믹스 ({mLabel(tm)})</b>
      <div style={{display:'flex',flexWrap:'wrap',gap:8,marginTop:10}}>
        {Object.entries(mix).map(([p,n])=><span key={p} className="chip tag-branch">{p} {n}</span>)}</div>
    </div>}

    {/* 랭킹 (관리자) */}
    {isMgr && <div className="card" style={{marginTop:12}}>
      <b>{me.role==='branch'?'지점':'팀'} 설계사 랭킹 ({mLabel(tm)})</b>
      <div style={{marginTop:10}}>
        {rank.map((r,i)=><div key={r.u.id} style={{marginBottom:10}}>
          <div className="row" style={{justifyContent:'space-between',marginBottom:4}}>
            <div style={{fontWeight:700,fontSize:13.5}}>{['🥇','🥈','🥉'][i]||(i+1+'.')} {r.u.name}</div>
            <div style={{fontSize:12,fontWeight:800}}>{won(r.ape)} · {r.cnt}건</div></div>
          <div style={{height:7,borderRadius:4,background:'#EEF2F8',overflow:'hidden'}}>
            <div style={{height:'100%',width:(r.ape/rmax*100)+'%',borderRadius:4,background:'linear-gradient(90deg,#1F5BFF,#38A4FF)'}}/></div>
        </div>)}
        {rank.length===0 && <div className="muted">설계사 실적이 없습니다.</div>}
      </div>
    </div>}
    <div className="muted" style={{textAlign:'center',fontSize:11,marginTop:12}}>ⓘ 지금은 데모 데이터 · 계약 등록/수수료는 백엔드 연결 후 실집계</div>
  </div>;
}

/* ───────── 커뮤니티 / 자료실 (전 인원 열람) ───────── */
function Community(){
  const cats=['전체','공지','상품자료','세일즈 스크립트','청구/서류','교육'];
  const [cat,setCat]=useState('전체');
  const posts=[
    {c:'공지',t:'9월 시상식 & 우수지점 안내',by:'본사',d:'09.25',hot:true},
    {c:'상품자료',t:'2026 실손보험 개정 핵심요약 (PDF)',by:'본사 상품팀',d:'09.24'},
    {c:'세일즈 스크립트',t:'출산 고객 어린이보험 접근 스크립트',by:'이팀장',d:'09.23',hot:true},
    {c:'청구/서류',t:'입원·수술 실손청구 필요서류 체크리스트',by:'본사',d:'09.20'},
    {c:'교육',t:'신인 13주 도입 교육자료 모음',by:'강남지점',d:'09.18'},
    {c:'세일즈 스크립트',t:'만기/갱신 고객 리텐션 대화법',by:'박설계',d:'09.15'},
  ];
  const list=posts.filter(p=>cat==='전체'||p.c===cat);
  return <div style={{marginTop:16}}>
    <div className="row" style={{justifyContent:'space-between',marginBottom:10}}>
      <div style={{fontWeight:900,fontSize:17}}>📚 커뮤니티 · 자료실</div>
      <button className="chip tag-branch" style={{border:'none'}}>＋ 글쓰기</button></div>
    <div style={{display:'flex',gap:7,overflowX:'auto',paddingBottom:8}}>
      {cats.map(x=><button key={x} className="chip" onClick={()=>setCat(x)}
        style={{whiteSpace:'nowrap',background:cat===x?'var(--navy)':'#EDF1F8',color:cat===x?'#fff':'var(--sub)'}}>{x}</button>)}
    </div>
    <div className="card" style={{padding:'4px 16px'}}>
      {list.map((p,i)=><div key={i} className="listrow">
        <div style={{flex:1}}>
          <div style={{fontWeight:700,fontSize:14}}>{p.hot&&<span style={{color:'#E23B4E'}}>🔥 </span>}{p.t}</div>
          <div className="muted" style={{fontSize:11.5}}><span className="chip tag-team" style={{padding:'1px 7px',fontSize:10}}>{p.c}</span>  {p.by} · {p.d}</div>
        </div><div style={{color:'var(--blue)',fontWeight:800}}>›</div>
      </div>)}
    </div>
    <div className="muted" style={{textAlign:'center',fontSize:11,marginTop:12}}>ⓘ 전 인원이 열람하는 자료실 · 글쓰기·업로드는 백엔드 연결 후 실동작</div>
  </div>;
}

function Person({u,team}){
  return <div className="listrow">
    <div className="ava">{u.name[0]}</div>
    <div style={{flex:1}}><div style={{fontWeight:700,fontSize:14}}>{u.name}{team?<span className="muted" style={{fontSize:11}}>  · {team.name}</span>:''}</div>
      <div className="muted" style={{fontSize:11.5}}>유지율 90% · 이번달 3건 · 활동 정상</div></div>
    <div style={{fontSize:12,color:'var(--blue)',fontWeight:800}}>›</div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
